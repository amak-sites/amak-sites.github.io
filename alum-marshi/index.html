<!doctype html><html lang="he" dir="rtl"><head>
<meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>אלום מרשי | עבודות אלומיניום בנצרת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* Aluminium trades: windows, shutters, louvred pergolas, gates. One template, four skins so that
   several aluminium shops in one city never get the same site.
   louver  - night graphite + brushed silver. Motif: louvre blades. Hero: louvred roof you open/close, in sun or rain. Plus a pinned sliding-gate moment.
   house   - dusk architecture, warm window glow. Motif: a lit window. Hero: a house elevation; tap a part (windows, shutters, pergola, gate) and it moves.
   factory - dark workshop + hot orange. Motif: a 45° mitre corner. Hero: a profile is fed, cut at 45°, framed and glazed, in the colour you pick.
   glass   - pale glass + bronze. Motif: a glint sweeping across glass. Hero: a sliding glass wall onto the hills that you open.
   Skin is chosen per business, so colours are fixed per skin. */
:root{
  --bg:#0D1014; --surface:#141920; --raise:#1B2129; --fg:#E9EDF2; --muted:#9AA5B2; --line:#28313B;
  --cta:#DDE4EB; --on-cta:#0D1014; --motif:#C9D3DD; --hi:#FFFFFF;
  --f-display:"Bellefair","Frank Ruhl Libre",Georgia,serif;
  --f-body:"Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:8px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
:root[data-skin="house"]{
  --bg:#F3F2EE; --surface:#FBFAF7; --raise:#E8E6E0; --fg:#1E2226; --muted:#596067; --line:#D9D6CE;
  --cta:#1E2226; --on-cta:#FFFFFF; --motif:#D98E2B; --glow:#FFC56B;
  --f-display:"Miriam Libre","Assistant",system-ui,sans-serif; --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:12px; color-scheme:light;
}
:root[data-skin="factory"]{
  --bg:#111111; --surface:#191918; --raise:#222220; --fg:#F2EFEA; --muted:#A9A49C; --line:#34322E;
  --cta:#FF6B1A; --on-cta:#160A02; --motif:#FF6B1A;
  --f-display:"Karantina","Heebo",system-ui,sans-serif; --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:3px; color-scheme:dark;
}
:root[data-skin="glass"]{
  --bg:#ECEFF1; --surface:#F7F8F9; --raise:#DEE3E7; --fg:#13202B; --muted:#4D5C68; --line:#CAD2D8;
  --cta:#8A5A2E; --on-cta:#FFFFFF; --motif:#8A5A2E;
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif; --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:20px; color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.7 var(--f-body);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--motif);outline-offset:3px;border-radius:4px}
:root[data-skin="house"] :focus-visible{outline-color:var(--fg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);position:relative}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;letter-spacing:.02em}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
h2{font:400 clamp(40px,6vw,76px)/1 var(--f-display)}
:root[data-skin="house"] h2{font-weight:700;letter-spacing:-.02em;line-height:1.02}
:root[data-skin="factory"] h2{font-weight:700;font-size:clamp(54px,8.4vw,108px);line-height:.88;letter-spacing:.005em}
:root[data-skin="glass"] h2{font-weight:900;letter-spacing:-.015em}
.eyebrow{font:500 13px/1.2 var(--f-body);letter-spacing:.12em;color:var(--muted)}

/* silver text for the louver skin: a slow highlight sweeps across the headline */
:root[data-skin="louver"] .hero h1,:root[data-skin="louver"] .final h2{background:linear-gradient(100deg,#8D98A5 0%,#F4F7FA 22%,#AEB8C3 40%,#E7ECF1 58%,#8D98A5 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}

/* ---------- motif marks (one per skin) ---------- */
.mark{display:flex;align-items:center;gap:14px;min-height:22px;color:var(--muted);font:500 13px/1.2 var(--f-body);letter-spacing:.1em}
.mark b{font-weight:500;white-space:nowrap}
/* louver: six blades that open as the section arrives */
.mark .blades{display:flex;gap:5px;flex:none;height:18px;align-items:center}
.mark .blades i{width:3px;height:16px;border-radius:2px;background:linear-gradient(#F4F7FA,#7D8894);transform:rotate(68deg);transition:transform .9s cubic-bezier(.2,.7,.1,1)}
.pre .mark .blades i{transform:rotate(0deg)}
/* house: a small lit window */
.mark .win{width:22px;height:18px;flex:none;border:1.5px solid var(--fg);border-radius:2px;position:relative;background:linear-gradient(var(--glow),#F7A93C);box-shadow:0 0 14px color-mix(in srgb,var(--glow) 80%,transparent);transition:background .8s,box-shadow .8s}
.mark .win::after{content:"";position:absolute;inset:0 50% 0 auto;border-left:1.5px solid var(--fg)}
.pre .mark .win{background:var(--raise);box-shadow:none}
/* factory: a mitred corner with a spark */
.mark .mitre{width:20px;height:20px;flex:none;position:relative}
.mark .mitre::before{content:"";position:absolute;inset:0;border-top:4px solid var(--motif);border-right:4px solid var(--motif)}
.mark .mitre::after{content:"";position:absolute;top:-1px;right:-1px;width:6px;height:6px;border-radius:50%;background:#FFE2B8;box-shadow:0 0 10px 3px var(--motif);animation:spark 2.4s ease-in-out infinite}
@keyframes spark{0%,70%,100%{opacity:0}78%{opacity:1}}
/* glass: a pane with a glint crossing it */
.mark .pane{width:56px;height:18px;flex:none;border:1.5px solid var(--motif);border-radius:3px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.mark .pane::after{content:"";position:absolute;top:-10px;bottom:-10px;width:10px;background:rgba(255,255,255,.9);transform:skewX(-24deg);animation:glint 3.6s ease-in-out infinite;right:-20px}
@keyframes glint{0%,55%{right:-20px}100%{right:80px}}

/* ---------- ribbon + header ---------- */
.ribbon{background:var(--fg);color:var(--bg);font-size:14px;position:relative;z-index:61}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.ribbon a{color:var(--bg);opacity:.85;white-space:nowrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand strong{font:400 24px/1 var(--f-display)}
:root[data-skin="house"] .brand strong,:root[data-skin="glass"] .brand strong{font-weight:700}
:root[data-skin="factory"] .brand strong{font-weight:700;font-size:30px;line-height:.9}
.brand span{font-size:13px;color:var(--muted)}
.hdr-phone{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:44px;font-size:15px;white-space:nowrap;flex:none}
.hdr-phone svg{width:18px;height:18px}

/* ---------- buttons ---------- */
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font:600 17px/1 var(--f-body);text-decoration:none;cursor:pointer;border:0;transition:transform .3s cubic-bezier(.2,.7,.1,1),box-shadow .3s;position:relative;overflow:hidden;isolation:isolate}
:root[data-skin="factory"] .btn{border-radius:var(--radius);font-weight:700}
.btn svg{width:21px;height:21px;flex:none}
.btn-main{background:var(--cta);color:var(--on-cta);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 34px -14px color-mix(in srgb,var(--cta) 85%,transparent)}
:root[data-skin="louver"] .btn-main{background:linear-gradient(180deg,#F6F8FA,#BCC6D0);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25),0 16px 36px -16px rgba(220,228,235,.5)}
:root[data-skin="louver"] .btn-main::after,:root[data-skin="glass"] .btn-main::after{content:"";position:absolute;inset:-20% auto -20% -40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:btnsweep 5.5s ease-in-out infinite;z-index:-1}
:root[data-skin="glass"] .btn-main::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
@keyframes btnsweep{0%,70%{left:-40%}100%{left:130%}}
:root[data-skin="factory"] .btn-main{box-shadow:0 0 0 1px #FF8F4F inset,0 18px 40px -16px rgba(255,107,26,.65)}
:root[data-skin="house"] .btn-main{box-shadow:0 16px 30px -16px rgba(30,34,38,.55)}
.btn-main:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.rating{display:inline-flex;align-items:center;gap:14px;text-decoration:none;width:fit-content;padding:6px 0}
.rating .score{font:400 46px/1 var(--f-display)}
:root[data-skin="house"] .rating .score,:root[data-skin="glass"] .rating .score{font-weight:700}
:root[data-skin="factory"] .rating .score{font-weight:700;font-size:56px}
.rating .stars{color:var(--motif);letter-spacing:2px;font-size:15px}
:root[data-skin="house"] .rating .stars{color:#C67B16}
.rating small{display:block;color:var(--muted);font-size:14px}

/* ---------- hero (shared) ---------- */
.hero{padding-block:44px 40px;position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:44px;align-items:center}
.hero-copy{display:grid;gap:20px;min-width:0;align-content:start}
.hero h1{font:400 clamp(56px,9vw,124px)/.92 var(--f-display);letter-spacing:-.005em}
:root[data-skin="house"] .hero h1{font-weight:700;letter-spacing:-.035em;line-height:.95;font-size:clamp(50px,7.6vw,104px)}
:root[data-skin="factory"] .hero h1{font-weight:700;font-size:clamp(84px,14vw,190px);line-height:.8}
:root[data-skin="glass"] .hero h1{font-weight:900;letter-spacing:-.02em;font-size:clamp(52px,8vw,112px)}
.hero h1 small{display:block;font:500 .3em/1.25 var(--f-body);letter-spacing:.02em;color:var(--muted);margin-top:14px;-webkit-text-fill-color:var(--muted)}
:root[data-skin="factory"] .hero h1 small{font-size:.17em;margin-top:18px}
.hero .tag{font-size:clamp(19px,2.1vw,23px);max-width:30ch;line-height:1.45}
.hero .lede{color:var(--muted);max-width:52ch}
.vis-col{display:grid;gap:14px;min-width:0}
.scene{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--raise);border:1px solid var(--line);max-width:100%;isolation:isolate}
.scene svg{display:block;width:100%;height:auto}
.scene-cap{position:absolute;inset-inline-start:12px;top:12px;font:500 12px var(--f-mono);color:var(--fg);background:color-mix(in srgb,var(--surface) 82%,transparent);padding:5px 10px;border-radius:999px;direction:rtl;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ctrl{display:grid;gap:12px}
.range-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.range-row label{font-size:14px;color:var(--muted)}
.range-row input[type=range]{flex:1;min-width:170px;accent-color:var(--motif);height:44px}
:root[data-skin="house"] .range-row input[type=range]{accent-color:var(--fg)}
.range-row output{font:500 17px var(--f-mono);min-width:4.5ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips>span{font-size:14px;color:var(--muted);margin-inline-end:4px}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:15px;transition:border-color .25s,background .25s}
:root[data-skin="factory"] .chips button{border-radius:var(--radius)}
.chips button i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}
.chips button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
:root[data-skin="factory"] .chips button[aria-pressed="true"]{border-color:var(--motif);box-shadow:inset 0 0 0 1px var(--motif)}

/* louver hero */
.hero-louver .scene{background:#0B0E12;box-shadow:0 50px 90px -50px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.04) inset}
.hero-louver .scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 80% 0%,rgba(255,255,255,.08),transparent 60%)}
.lv-blade{transition:none}
#lv-rain{stroke:#CFE3F1;stroke-width:1.1;stroke-linecap:round;opacity:.75}
#lv-splash{fill:none;stroke:#CFE3F1;stroke-width:1;opacity:.6}
#lv-gutter{stroke:#CFE3F1;stroke-width:3;stroke-dasharray:5 9;stroke-linecap:round;fill:none;opacity:0;transition:opacity .4s;animation:flow .5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}

/* house hero */
.hero-house .hero-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.hero-house .scene{background:#22314A;border:0;box-shadow:0 40px 80px -40px rgba(30,34,38,.55)}
.hs-part{transition:opacity .5s,filter .5s}
.scene[data-f] .hs-part:not(.on){opacity:.55}
.scene[data-f] .hs-part.on{filter:drop-shadow(0 0 6px rgba(255,197,107,.9))}
.hotspot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.hotspot i{width:18px;height:18px;border-radius:50%;background:#FFF6E6;box-shadow:0 0 0 4px rgba(255,197,107,.45);position:relative;display:block;transition:transform .3s}
.hotspot i::before,.hotspot i::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:1.6px;background:#1E2226;transform:translate(-50%,-50%)}
.hotspot i::after{transform:translate(-50%,-50%) rotate(90deg)}
.hotspot::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid #FFC56B;animation:ping 2.4s ease-out infinite}
.hotspot[aria-pressed="true"] i{transform:scale(1.25);background:#FFC56B}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.part-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:4px;min-height:96px}
.part-card b{font:700 21px/1.2 var(--f-display)}
.part-card p{color:var(--muted);font-size:15px}

/* factory hero */
.hero-factory{overflow:hidden}
.hero-factory::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 25% 60%,rgba(255,107,26,.10),transparent 70%);pointer-events:none}
.hero-factory .scene{background:#161615;border-color:#2E2C29;box-shadow:0 50px 90px -50px rgba(0,0,0,.95)}
.fx-prof{fill:var(--prof,#B9BEC3);transition:fill .6s}
.fx-status{display:flex;gap:6px;flex-wrap:wrap}
.fx-status span{font:500 12px var(--f-mono);padding:6px 10px;border:1px solid var(--line);color:var(--muted);border-radius:var(--radius);transition:all .3s}
.fx-status span.on{border-color:var(--motif);color:var(--fg);background:color-mix(in srgb,var(--motif) 14%,transparent)}

/* glass hero */
.hero-glass .scene{background:#DCE4EA;border:0;box-shadow:0 44px 80px -44px rgba(19,32,43,.45)}
.gl-frame{fill:var(--frame,#8A5A2E);transition:fill .6s}
.gl-glint{animation:glsweep 7s ease-in-out infinite}
@keyframes glsweep{0%,40%{transform:translateX(-160px)}100%{transform:translateX(420px)}}
.gl-wind path{fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;opacity:0;transition:opacity .6s}
.wallbox{position:relative}
.snap{position:absolute;left:-5%;bottom:-12%;width:38%;margin:0;background:#fff;padding:6px 6px 0;box-shadow:0 26px 50px -20px rgba(19,32,43,.55);transform:rotate(-3deg);z-index:3;border-radius:4px}
.snap img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px}
.snap figcaption{font:500 11px/1.3 var(--f-mono);color:#13202B;padding:7px 2px 8px;display:flex;justify-content:space-between;gap:8px}

/* ---------- stats band ---------- */
.band{border-block:1px solid var(--line);background:var(--surface)}
.band .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:20px 18px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font:400 40px/1 var(--f-display)}
:root[data-skin="house"] .stat b,:root[data-skin="glass"] .stat b{font-weight:700}
:root[data-skin="factory"] .stat b{font-weight:700;font-size:52px;line-height:.9;color:var(--motif)}
.stat span{color:var(--muted);font-size:14px}

/* ---------- film ---------- */
.film{position:relative;height:clamp(420px,72vh,720px);background:#0B0B0A;color:#F4F2EE;overflow:hidden;isolation:isolate}
:root[data-skin="glass"] .film{margin-inline:var(--gut);border-radius:var(--radius);margin-block:10px 0}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1;z-index:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.slide.on img{animation:kb 7s linear forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-2%,-1%)}}
.film::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.2) 45%,transparent 65%)}
:root[data-skin="house"] .film::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(34,49,74,.35),transparent 40%)}
.film-ui{position:absolute;inset:auto 0 0;z-index:3;padding-block:0 28px}
.film-ui .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.film .mark{color:rgba(244,242,238,.75)}
.film-cap{font:400 clamp(28px,4vw,52px)/1.08 var(--f-display);margin-top:10px;min-height:2.2em;max-width:22ch;text-wrap:balance}
:root[data-skin="house"] .film-cap,:root[data-skin="glass"] .film-cap{font-weight:700}
.film-meta{display:flex;gap:14px;margin-top:8px;color:rgba(244,242,238,.72);font-size:14px;flex-wrap:wrap}
.film-nav{display:flex;gap:8px}
.film-nav button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F4F2EE;cursor:pointer;display:grid;place-items:center}
.film-nav svg{width:20px;height:20px}

section{padding-block:88px}
.sec-head{display:grid;gap:14px;margin-bottom:42px;max-width:800px}
.sec-head p{color:var(--muted);max-width:60ch}

/* ---------- services ---------- */
.svc{display:grid}
.svc .it{min-width:0;position:relative}
.svc h3{font:400 clamp(26px,3vw,36px)/1.1 var(--f-display)}
:root[data-skin="house"] .svc h3,:root[data-skin="glass"] .svc h3{font-weight:700;font-size:clamp(23px,2.4vw,28px)}
:root[data-skin="factory"] .svc h3{font-weight:700;font-size:clamp(34px,4vw,46px);line-height:.95}
.svc p{color:var(--muted)}
.svc .code,.svc .ico{display:none}
/* louver: full-width rows that open like blades */
:root[data-skin="louver"] .svc{border-top:1px solid var(--line);perspective:900px}
:root[data-skin="louver"] .svc .it{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:baseline;padding:26px 8px;border-bottom:1px solid var(--line);transform-origin:50% 0;transition:transform 1s cubic-bezier(.2,.7,.1,1),background .5s;overflow:hidden}
:root[data-skin="louver"] .svc .it.pre{transform:rotateX(-62deg)}
:root[data-skin="louver"] .svc .code{display:block;font:500 13px var(--f-mono);color:var(--muted)}

  const FX = (() => { const w=170,h=124,T=14,cx=200,cy=128,by=262; const L=[w,h,w,h];

  }[skin];

  document.getElementById("app").innerHTML = `
  ${S.demo ? `<div class="ribbon"><div class="wrap"><span>אתר לדוגמה שהוכן עבור ${esc(S.business)}${photos.length?" מהתמונות והביקורות בגוגל":" מהביקורות בגוגל"}. עדיין לא פורסם.</span><a href="#offer">ההצעה ל${esc(offerTo)} ←</a></div></div>`:""}
  <header><div class="wrap">
    <div class="brand"><strong>${esc(S.business)}</strong><span>${esc(S.trade)} · ${esc(S.city)}</span></div>
    <a class="hdr-phone" href="tel:${esc(S.phone)}">${phoneIcon}<span class="lbl">טלפון:</span><span class="mono">${esc(S.phone)}</span></a>
  </div></header>
  <main>${HERO()}${ORDER.map(f=>f()).join("")}</main>
  <footer class="site"><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(S.business)}</span><span>${esc(S.city)} · <span class="mono">${esc(S.phone)}</span></span></div></footer>
  <div class="bar"><a class="btn btn-main" href="${wa}" target="_blank" rel="noopener">${waIcon}וואטסאפ</a><a class="btn btn-ghost" href="tel:${esc(S.phone)}">${phoneIcon}חיוג</a></div>`;

  /* ---------------- behaviour ---------------- */
  if (!reduce && "IntersectionObserver" in window){
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("pre"); io.unobserve(e.target);} }),{rootMargin:"0px 0px -8% 0px"});
    document.querySelectorAll(".rv").forEach(el=>{ if(el.getBoundingClientRect().top > innerHeight){ el.classList.add("pre"); io.observe(el);} });
  }
  // pause hero loops while the hero is off screen
  let heroVisible = true;
  const sceneEl = document.getElementById("scene");
  if (sceneEl && "IntersectionObserver" in window) new IntersectionObserver(es=>{ heroVisible = es[0].isIntersecting; }).observe(sceneEl);
  const loop = fn => { const f = t => { if (heroVisible) fn(t); requestAnimationFrame(f); }; requestAnimationFrame(f); };
  const pressGroup = (sel, btn) => document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed", x===btn ? "true":"false"));

  // LOUVER: blades rotate; light falls through the gaps; rain runs off a closed roof
  if (skin === "louver"){
    const {N,x0,x1,y,L} = LV, sp = (x1-x0)/N, cxs = Array.from({length:N},(_,k)=>x0 + sp*(k+.5));
    const bl = document.getElementById("lv-blades");
    bl.innerHTML = cxs.map(cx=>`<path class="lv-blade" transform="translate(${cx.toFixed(1)} ${y})" fill="url(#lblade)" stroke="#5E6873" stroke-width=".6" d="M-15 0Q-10-4.2 0-4.2Q10-4.2 15 0Q10 3.2 0 3.2Q-10 3.2-15 0Z"/>`).join("");
    const blades = [...bl.children], beams = document.getElementById("lv-beams"), shadow = document.getElementById("lv-shadow");
    const range = document.getElementById("lv-open"), out = document.getElementById("lv-out"), cap = document.getElementById("scene-cap");
    const rainP = document.getElementById("lv-rain"), splP = document.getElementById("lv-splash"), gut = document.getElementById("lv-gutter");
    const sun = document.getElementById("lv-sun"), clouds = document.getElementById("lv-clouds"), s1 = document.getElementById("ls1"), s2 = document.getElementById("ls2");
    let open = .7, weather = "sun", auto = !reduce;
    const drops = Array.from({length:70},()=>({x:Math.random()*420-10, y:Math.random()*320, v:5+Math.random()*3}));
    let splashes = [];
    const setWeather = w => { weather = w;
      sun.style.opacity = w==="sun" ? 1 : 0; clouds.setAttribute("opacity", w==="rain" ? 1 : 0);
      s1.setAttribute("stop-color", w==="sun" ? "#7F97AC" : "#4C5662"); s2.setAttribute("stop-color", w==="sun" ? "#D3DCE3" : "#8B96A0");
      if (w==="sun"){ rainP.setAttribute("d",""); splP.setAttribute("d",""); }
      draw(); };
    const draw = () => {
      const a = open * 82 * Math.PI/180, half = L/2*Math.cos(a);
      blades.forEach((b,k)=>b.setAttribute("transform", `translate(${cxs[k].toFixed(1)} ${y}) rotate(${(-open*82).toFixed(1)})`));
      const gap = Math.max(0, sp - 2*half);
      if (weather==="sun"){
        const dx = -46; let p = "";
        for (let k=0;k<N-1;k++){ const a1 = cxs[k]+half, a2 = cxs[k+1]-half; if (a2<=a1) continue;
          p += `<path d="M${a1.toFixed(1)} ${y}L${a2.toFixed(1)} ${y}L${(a2+dx).toFixed(1)} 292L${(a1+dx).toFixed(1)} 292Z" fill="url(#lbeam)" opacity="${(.35+.65*open).toFixed(2)}"/>`;
          p += `<rect x="${(a1+dx).toFixed(1)}" y="290" width="${(a2-a1).toFixed(1)}" height="12" fill="#FFF3D6" opacity=".55"/>`; }
        beams.innerHTML = p; shadow.setAttribute("x", 52-46); shadow.setAttribute("opacity", .38);
      } else { beams.innerHTML = ""; shadow.setAttribute("x", 52); shadow.setAttribute("opacity", .22); }
      gut.style.opacity = (weather==="rain" && gap < 3) ? 1 : 0;
      out.textContent = Math.round(open*100) + "%";
      cap.textContent = `להמחשה · ${weather==="sun"?"שמש":"גשם"} · ${gap < 3 ? "גג סגור" : open > .66 ? "רפפות פתוחות" : "פתוח חלקית"}`;
    };
    const rainTick = () => {
      if (weather!=="rain") return;
      const closed = (sp - L*Math.cos(open*82*Math.PI/180)) < 3;
      let d = "";
      drops.forEach(o=>{ o.y += o.v; o.x -= o.v*.18;
        const under = o.x>44 && o.x<356;
        const stop = under && closed ? 66 : 292;
        if (o.y >= stop){ if (stop===292) splashes.push({x:o.x, r:1, a:1}); o.y = -10 - Math.random()*40; o.x = Math.random()*440-10; }
        d += `M${o.x.toFixed(1)} ${o.y.toFixed(1)}l-1.6 7`; });
      rainP.setAttribute("d", d);
      splashes = splashes.filter(s=>(s.r+=.6, s.a-=.08, s.a>0)).slice(-30);
      splP.setAttribute("d", splashes.map(s=>`M${(s.x-s.r).toFixed(1)} 292a${s.r.toFixed(1)} ${(s.r*.35).toFixed(1)} 0 0 1 ${(2*s.r).toFixed(1)} 0`).join(""));
    };
    range.addEventListener("input", ()=>{ auto=false; open = +range.value/100; draw(); });
    document.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click", ()=>{ auto=false; pressGroup("[data-w]", b); setWeather(b.dataset.w); }));
    draw();
    if (!reduce){
      let t0 = performance.now(), lastW = 0;
      loop(t=>{ if (auto){ const e = (t-t0)/1000; open = .5 + .5*Math.sin(e*.7); range.value = Math.round(open*100);
          const w = Math.floor(e/9) % 2 ? "rain" : "sun"; if (w!==weather){ pressGroup("[data-w]", document.querySelector(`[data-w="${w}"]`)); setWeather(w); } draw(); }
        rainTick(); });
    }
    // gate: scroll slides it open
    const G = document.getElementById("gate"), leaf = document.getElementById("gate-leaf"), hello = document.getElementById("gate-hello");
    const gset = p => { leaf.setAttribute("transform", `translate(${(p*300).toFixed(1)} 0)`); hello.setAttribute("opacity", clamp((p-.45)*2.2,0,1).toFixed(2)); };
    if (reduce) gset(.7);
    else { const gs = () => { const r = G.getBoundingClientRect(); const p = clamp(-r.top / Math.max(1, r.height - innerHeight), 0, 1); gset(ease(p)); };
      addEventListener("scroll", gs, {passive:true}); addEventListener("resize", gs); gs(); }
  }

  // HOUSE: tap a part, it moves; cycles on its own until touched
  if (skin === "house"){
    const scene = document.getElementById("scene"), tt = document.getElementById("part-t"), td = document.getElementById("part-d");
    const slide = document.getElementById("hs-slide"), cur = [document.getElementById("sh1"), document.getElementById("sh2")];
    const slats = [...document.querySelectorAll(".hs-slat")], shadeP = document.getElementById("hs-pshade"), gateG = document.getElementById("hs-gate");
    const st = {win:0, shut:0, perg:1, gate:0}; let target = {...st}; let focus = null, auto = !reduce, pergT = 1;
    const apply = () => {
      slide.setAttribute("transform", `translate(${(-70*st.win).toFixed(1)} 0)`);
      cur.forEach(c=>c.setAttribute("transform", `translate(0 ${(56*st.shut).toFixed(1)})`));
      slats.forEach((s,k)=>{ const p = clamp(pergT*12 - k, 0, 1); s.setAttribute("opacity", p.toFixed(2)); s.setAttribute("transform", `translate(0 ${(-14*(1-p)).toFixed(1)})`); });
      shadeP.setAttribute("opacity", (.55*pergT).toFixed(2));
      gateG.setAttribute("transform", `translate(${(50*st.gate).toFixed(1)} 0)`);
    };
    const select = (k, user) => {
      if (user) auto = false;
      focus = k; scene.dataset.f = k;
      document.querySelectorAll(".hs-part").forEach(g=>g.classList.toggle("on", g.dataset.part===k));
      document.querySelectorAll(".hotspot,[data-k]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k ? "true":"false"));
      const p = PARTS.find(x=>x.k===k); tt.textContent = p.t; td.textContent = p.d;
      target = {win:0, shut:0, perg:1, gate:0};
      if (k==="win") target.win = 1; if (k==="shut") target.shut = 1; if (k==="gate") target.gate = 1;
      if (k==="perg") pergT = 0;
      if (reduce){ Object.assign(st, target); pergT = 1; apply(); }
    };
    document.querySelectorAll(".hotspot,.chips [data-k]").forEach(b=>b.addEventListener("click", ()=>select(b.dataset.k, true)));
    apply();
    if (!reduce){
      let t0 = performance.now(), idx = -1;
      loop(t=>{ if (auto){ const i = Math.floor((t-t0)/3800) % PARTS.length; if (i!==idx){ idx = i; select(PARTS[i].k, false); } }
        for (const k in st) st[k] += (target[k]-st[k])*.06;
        if (pergT < 1) pergT = Math.min(1, pergT + .012);
        apply(); });
    }
  }

  // FACTORY: a timeline loop. Profile slides in, three 45° cuts, pieces fly into a frame, glass, stamp.
  if (skin === "factory"){
    const P = [0,1,2,3].map(i=>document.getElementById("fx-p"+i)), saw = document.getElementById("fx-saw"), blade = document.getElementById("fx-blade");
    const glass = document.getElementById("fx-glass"), stamp = document.getElementById("fx-stamp"), sparksP = document.getElementById("fx-sparks");
    const ang = document.getElementById("fx-angle"), status = [...document.querySelectorAll("#fx-status span")], scene = document.getElementById("scene");
    const setColor = i => scene.style.setProperty("--prof", PROF[i][1]);
    setColor(S.colorDefault ?? 2);
    document.querySelectorAll(".hero-factory .chips button").forEach(b=>b.addEventListener("click", ()=>{ pressGroup(".hero-factory .chips button", b); setColor(+b.dataset.i); }));
    let sparks = [], lastCut = -1;
    const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);
    const render = (t, dt) => {
      const slideIn = ease(seg(t,0,.16)), fly = [0,1,2,3].map(i=>ease(seg(t,.36+i*.035,.56+i*.035)));
      const cuts = [0,1,2].map(i=>seg(t,.18+i*.06,.22+i*.06));
      const sep = i => [0,1,2].reduce((a,c,j)=>a + (j<i ? cuts[j]*7 : 0), 0);
      P.forEach((g,i)=>{ const b = FX.bar[i], f = FX.fr[i];
        const bx = b.x + (1-slideIn)*420 + sep(i), by = FX.by;
        const x = lerp(bx, f.x, fly[i]), y = lerp(by, f.y, fly[i]) - Math.sin(fly[i]*Math.PI)*40, r = lerp(b.r, f.r, fly[i]);
        g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(1)})`); });
      // saw follows the active cut
      let ci = cuts.findIndex(c=>c>0 && c<1); const cutting = ci>=0;
      const sx = cutting ? FX.seams[ci] + sep(ci) : FX.seams[Math.min(2, Math.max(0, cuts.filter(c=>c>=1).length))];
      const down = cutting ? Math.sin(cuts[ci]*Math.PI) : 0;
      saw.setAttribute("transform", `translate(${sx.toFixed(1)} ${(206 + down*40).toFixed(1)})`);
      saw.style.opacity = t < .36 ? 1 : Math.max(0, 1-(t-.36)*12);
      blade.setAttribute("transform", `rotate(${(t*4000)%360})`);
      if (cutting && down > .5) for (let k=0;k<3;k++) sparks.push({x:sx, y:FX.by-6, vx:-(1+Math.random()*3), vy:-(1.5+Math.random()*3), l:1});
      ang.setAttribute("opacity", cutting ? 1 : 0); if (cutting){ ang.setAttribute("x", sx+8); ang.setAttribute("y", FX.by-22); }
      sparks = sparks.filter(s=>(s.x+=s.vx, s.y+=s.vy, s.vy+=.25, s.l-=.04, s.l>0)).slice(-90);
      sparksP.setAttribute("d", sparks.map(s=>`M${s.x.toFixed(1)} ${s.y.toFixed(1)}l${(s.vx*1.6).toFixed(1)} ${(s.vy*1.6).toFixed(1)}`).join(""));
      const gl = ease(seg(t,.64,.76)); glass.setAttribute("opacity", gl.toFixed(2)); glass.setAttribute("transform", `translate(0 ${(-(1-gl)*120).toFixed(1)})`);
      const fade = 1 - seg(t,.95,1), sp = seg(t,.78,.82); stamp.setAttribute("opacity", (sp*fade).toFixed(2)); stamp.setAttribute("transform", `translate(${FX.cx} ${FX.cy+FX.h/2+34}) rotate(-4) scale(${(1.4-.4*sp).toFixed(2)})`);
      document.getElementById("fx-pieces").setAttribute("opacity", fade); glass.parentNode.setAttribute("opacity", fade);
      const phase = t<.17?0 : t<.35?1 : t<.62?2 : t<.78?3 : 4;
      status.forEach((s,i)=>s.classList.toggle("on", i===phase));
    };
    if (reduce) render(.9, 0);
    else { let t0 = performance.now(); const D = 10500; loop(t=>render(((t-t0)%D)/D)); }
  }

  // GLASS: slide the panel open; wind comes in; frame colour
  if (skin === "glass"){
    const sash = document.getElementById("gl-sash"), range = document.getElementById("gl-open"), out = document.getElementById("gl-out");
    const wind = [...document.querySelectorAll("#gl-wind path")], scene = document.getElementById("scene"), cap = document.getElementById("scene-cap");
    let p = 0, auto = !reduce;
    const draw = () => { sash.setAttribute("transform", `translate(${(-146*p).toFixed(1)} 0)`); out.textContent = Math.round(p*100)+"%";
      wind.forEach((w,i)=>w.style.opacity = clamp((p-.35-i*.12)*2.5,0,.85)); cap.textContent = p < .05 ? "ויטרינה הזזה · סגורה" : `ויטרינה הזזה · פתוחה ${Math.round(p*100)}%`; };
    range.addEventListener("input", ()=>{ auto=false; p = +range.value/100; draw(); });
    document.querySelectorAll(".hero-glass .chips button").forEach(b=>b.addEventListener("click", ()=>{ pressGroup(".hero-glass .chips button", b); scene.style.setProperty("--frame", FRAMES[+b.dataset.i][1]); }));
    draw();
    if (!reduce){ let t0 = performance.now(); loop(t=>{ if (!auto) return; const e=(t-t0)/1000; p = clamp(.5 - .55*Math.cos(e*.55), 0, 1); range.value = Math.round(p*100); draw(); }); }
    else { p = .6; range.value = 60; draw(); }
    // wind paths drift
    if (!reduce) wind.forEach((w,i)=>w.animate([{transform:"translateX(0)"},{transform:"translateX(-60px)"}],{duration:2600+i*500,iterations:Infinity}));
  }

  // film
  const F = document.getElementById("film");
  if (F){
    const slides=[...F.querySelectorAll(".slide")], cap=document.getElementById("film-cap"), cnt=document.getElementById("film-count"), n=slides.length;
    let i=0, timer=null;
    const go = k => { i=(k+n)%n;
      slides.forEach((s,j)=>{ s.classList.toggle("on", j===i); s.setAttribute("aria-hidden", j===i?"false":"true"); });
      const img = slides[i].querySelector("img"); img.style.animation="none"; void img.offsetWidth; img.style.animation="";
      cap.textContent = photos[i].cap || ""; cnt.textContent = `${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`; };
    const play = () => { clearInterval(timer); if (!reduce) timer = setInterval(()=>go(i+1), 6500); };
    document.getElementById("film-next").addEventListener("click", ()=>{ go(i+1); play(); });
    document.getElementById("film-prev").addEventListener("click", ()=>{ go(i-1); play(); });
    F.addEventListener("pointerenter", e=>{ if(e.pointerType==="mouse") clearInterval(timer); });
    F.addEventListener("pointerleave", play);
    let sx=null;
    F.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; }, {passive:true});
    F.addEventListener("touchend", e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){ go(i + (dx>0?1:-1)); play(); } sx=null; });
    play();
  }
})();
</script>


<script>window.T3D={"kind": "slider", "accent": "#C9A96E", "accent2": "#F2E2C2", "bg1": "#0D0B08", "bg2": "#2A2318", "ink": "#FBF7F0", "profile": "#7a5b3a", "sun": "#ffd38a", "view": "#9db6c9", "eyebrow": "אלום מרשי · נצרת", "title": "עבודה מדויקת, נקייה, ובזמן.", "text": "5 בגוגל. מהשנייה הראשונה יודעים שהגיעו לבעל מקצוע.", "hint": "גררו כדי לסובב"};</script>
<script>/* Trade 3D band: one three.js scene per trade, injected right after the hero.
   Config: window.T3D = {kind, accent, accent2, bg1, bg2, ink, eyebrow, title, text, hint}
   kinds: bulb | breakers | lock | washer | gears | solar | roller | roof | car-paint | car-scan | shower | slider | louver | pergola | cabinet | pipes | build */
(function(){
  var C = window.T3D; if (!C) return;
  var main = document.querySelector('main'); if (!main || !main.firstElementChild) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var small = innerWidth < 768;
  var css = document.createElement('style');
  css.textContent =
  '.t3d{position:relative;padding:0!important;margin:0;isolation:isolate}' +
  '.t3d-in{position:relative;height:clamp(440px,74vh,680px);overflow:hidden;background:radial-gradient(120% 90% at 30% 35%,' + C.bg2 + ',' + C.bg1 + ' 70%)}' +
  '.t3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}' +
  '.t3d canvas:active{cursor:grabbing}' +
  '.t3d-in::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 60% at 50% 120%,rgba(0,0,0,.35),transparent 60%)}' +
  '.t3d-cap{position:absolute;z-index:2;inset-inline-start:max(16px,4vw);bottom:clamp(18px,5vh,44px);max-width:min(440px,calc(100% - 32px));padding:20px 22px;border-radius:18px;color:' + C.ink + ';background:color-mix(in srgb,' + C.bg1 + ' 58%,transparent);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid color-mix(in srgb,' + C.ink + ' 14%,transparent);display:grid;gap:8px}' +
  '.t3d-eye{font-size:13px;letter-spacing:.14em;opacity:.75}' +
  '.t3d-cap h2{margin:0;font-size:clamp(28px,3.6vw,44px);line-height:1.02;text-wrap:balance}' +
  '.t3d-cap p{margin:0;font-size:16px;line-height:1.55;opacity:.85}' +
  '.t3d-hint{display:inline-flex;align-items:center;gap:8px;font-size:13px;opacity:.65;margin-top:2px}' +
  '.t3d-hint i{width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;position:relative}' +
  '.t3d-hint i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:currentColor;animation:t3dp 1.8s ease-in-out infinite}' +
  '@keyframes t3dp{50%{transform:translateX(-4px)}}' +
  '.t3d-ui{position:absolute;z-index:2;inset-inline-end:max(16px,4vw);top:clamp(24px,5vh,40px);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}' +
  '.t3d-ui button{width:44px;height:44px;border-radius:50%;border:2px solid color-mix(in srgb,' + C.ink + ' 30%,transparent);cursor:pointer;padding:0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 6px 16px -6px rgba(0,0,0,.5);transition:transform .25s}' +
  '.t3d-ui button[aria-pressed="true"]{border-color:' + C.ink + ';transform:scale(1.12)}' +
  '.t3d-fallback{position:absolute;inset:0;display:grid;place-items:center;opacity:.5;color:' + C.ink + '}' +
  '@media (max-width:640px){.t3d-in{height:560px}.t3d-cap{bottom:14px;padding:16px}.t3d-cap p{font-size:15px}}' +
  '@media (prefers-reduced-motion:reduce){.t3d-hint i::after{animation:none}}';
  document.head.appendChild(css);
  var sec = document.createElement('section');
  sec.className = 't3d'; sec.setAttribute('aria-label', C.title);
  sec.innerHTML = '<div class="t3d-in"><canvas aria-hidden="true"></canvas>' + (C.swatches ? '<div class="t3d-ui" role="group" aria-label="צבע"></div>' : '') +
    '<div class="t3d-cap"><span class="t3d-eye">' + C.eyebrow + '</span><h2>' + C.title + '</h2><p>' + C.text + '</p><span class="t3d-hint"><i></i>' + (C.hint || 'גררו כדי לסובב') + '</span></div></div>';
  main.firstElementChild.after(sec);
  var canvas = sec.querySelector('canvas');

  function go(){
    var T = window.THREE;
    var R = new T.WebGLRenderer({canvas: canvas, antialias: !small, alpha: true, powerPreference: 'high-performance'});
    R.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : 2));
    R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = .86;
    var S = new T.Scene();
    var cam = new T.PerspectiveCamera(34, 1, .1, 100);
    var col = function(c){ return new T.Color(c); };
    var A = col(C.accent), A2 = col(C.accent2 || C.accent);

    // soft studio environment for reflections
    var env = new T.Scene();
    var eg = new T.SphereGeometry(20, 32, 16);
    var ec = [], top = col('#ffffff'), bot = col(C.bg1);
    for (var i = 0; i < eg.attributes.position.count; i++){ var y = eg.attributes.position.getY(i)/20; var c = bot.clone().lerp(top, (y+1)/2*.6); ec.push(c.r, c.g, c.b); }
    eg.setAttribute('color', new T.Float32BufferAttribute(ec, 3));
    env.add(new T.Mesh(eg, new T.MeshBasicMaterial({vertexColors: true, side: T.BackSide})));
