<title>מוחמד התקנת מזגנים | התקנת מזגנים עד הבית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;700;900&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* AC template. Signature: a live indoor unit blowing air (canvas) + cool/heat mode that re-tints the whole page.
   Brand colours come from config (brand.cool / brand.warm). */
:root{
  --night:#06101C; --deep:#0B1A2C; --panel:#0F2238; --line:#1E3550;
  --mist:#8FA6BF; --snow:#EEF4FA;
  --cool:#4FA3E8; --cool-2:#9AD4FF;
  --warm:#F5A33A; --warm-2:#FFD08A;
  --acc:var(--cool); --acc-2:var(--cool-2);
  --cta:var(--warm); --cta-ink:#1B1003;
  --f-d:"Rubik","Assistant",system-ui,sans-serif;
  --f-b:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:max(18px,env(safe-area-inset-left,0px)); --gut-r:max(18px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
body.heat{--acc:var(--warm);--acc-2:var(--warm-2)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--snow);font:400 18px/1.6 var(--f-b);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .8s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc-2);outline-offset:3px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);position:relative;z-index:2}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 14px/1.2 var(--f-b);letter-spacing:.12em;color:var(--acc-2);transition:color .8s}
.eyebrow::before{content:"";width:26px;height:2px;border-radius:2px;background:currentColor;box-shadow:0 0 10px currentColor}
h1,h2,h3{text-wrap:balance;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2{font:700 clamp(38px,5.6vw,68px)/1.02 var(--f-d);letter-spacing:-.01em}
p{margin:0}

.ribbon{position:relative;z-index:61;background:#0A1626;border-bottom:1px solid var(--line);font-size:14px;color:var(--mist)}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.ribbon b{color:var(--snow);font-weight:600}
.ribbon a{color:var(--cta);text-decoration:none;white-space:nowrap}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--night) 72%,transparent);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.logo{display:flex;align-items:flex-end;gap:6px;text-decoration:none;line-height:.8}
.logo .a{font:900 34px/.8 var(--f-d);background:linear-gradient(180deg,#7DBDF2,#2D78C4);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .b{font:700 17px/1 var(--f-d);color:var(--warm);padding-bottom:2px}
.hdr-phone{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;min-height:44px}
.hdr-phone svg{width:20px;height:20px}

/* HERO */
.hero{position:relative;padding-block:48px 72px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20% -10% auto;height:120%;z-index:-1;background:radial-gradient(60% 55% at 28% 30%,color-mix(in srgb,var(--acc) 32%,transparent),transparent 70%),radial-gradient(40% 40% at 85% 90%,color-mix(in srgb,var(--warm) 14%,transparent),transparent 70%);transition:background .8s}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:36px;align-items:center}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero h1{font:900 clamp(92px,15vw,200px)/.78 var(--f-d);letter-spacing:-.03em;display:flex;align-items:flex-end;gap:.08em;flex-wrap:wrap}
.hero h1 .a{background:linear-gradient(180deg,#A9D8FF 0%,#4FA3E8 55%,#2468B4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 18px 40px rgba(79,163,232,.35))}
.hero h1 .b{font-size:.32em;font-weight:700;color:var(--warm);padding-bottom:.18em;letter-spacing:0}
.hero .sub{font:300 clamp(20px,2.4vw,28px)/1.3 var(--f-d);color:var(--snow);max-width:24ch}
.hero .sub b{font-weight:700;color:var(--acc-2);transition:color .8s}
.hero .lede{color:var(--mist);max-width:50ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;font:700 18px/1 var(--f-b);text-decoration:none;cursor:pointer;border:0;transition:transform .25s cubic-bezier(.2,.7,.1,1),box-shadow .25s,background .25s}
.btn svg{width:22px;height:22px;flex:none}
.btn-cta{background:linear-gradient(180deg,#FFC067,var(--cta));color:var(--cta-ink);box-shadow:0 12px 40px -10px color-mix(in srgb,var(--cta) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-cta:hover{transform:translateY(-2px);box-shadow:0 18px 50px -8px color-mix(in srgb,var(--cta) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--snow);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--acc)}
.rating{display:inline-flex;align-items:center;gap:14px;padding:10px 18px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--panel) 70%,transparent);text-decoration:none;width:fit-content}
.rating .score{font:700 38px/1 var(--f-d)}
.rating .stars{color:var(--warm);letter-spacing:2px;font-size:15px}
.rating small{display:block;color:var(--mist);font-size:14px}

/* the unit */
.unit-stage{position:relative;aspect-ratio:1/1.02;min-width:0}
.unit-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.unit{position:absolute;top:8%;inset-inline:4%;height:23%;border-radius:22px 22px 30px 30px;background:linear-gradient(180deg,#FBFDFF 0%,#E7EEF6 62%,#CBD7E4 100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),inset 0 -6px 0 rgba(0,0,0,.06),inset 0 2px 0 #fff}
.unit::after{content:"";position:absolute;inset:auto 6% 16% 6%;height:2px;background:rgba(15,34,56,.12);border-radius:2px}
.unit .brandmark{position:absolute;top:22%;right:7%;font:900 22px/1 var(--f-d);color:#2D78C4}
.unit .brandmark span{font-weight:700;font-size:12px;color:#E08B1F;margin-inline-start:4px}
.unit .disp{position:absolute;top:20%;left:7%;display:flex;align-items:center;gap:8px;font:500 26px/1 var(--f-m);color:var(--acc);text-shadow:0 0 12px var(--acc);transition:color .6s,text-shadow .6s;direction:ltr}
.unit .disp i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.25}}
.unit .vent{position:absolute;inset:auto 5% -6px 5%;height:22%;border-radius:0 0 26px 26px;background:linear-gradient(180deg,#0B1726,#1C2F45);overflow:hidden}
.unit .louver{position:absolute;inset:auto 4% 2px 4%;height:9px;border-radius:6px;background:linear-gradient(180deg,#F5F8FB,#BFCCDA);transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite alternate}
@keyframes swing{from{transform:perspective(300px) rotateX(-12deg)}to{transform:perspective(300px) rotateX(-58deg)}}
.remote{position:absolute;bottom:3%;inset-inline-start:2%;width:min(220px,58%);padding:16px;border-radius:24px;background:linear-gradient(180deg,#14283F,#0C1B2D);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.8);display:grid;gap:12px}
.remote .scr{border-radius:14px;padding:12px 14px;background:#07131F;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end}
.remote .t{font:500 44px/.9 var(--f-m);color:var(--acc-2);transition:color .6s;direction:ltr}
.remote .t sup{font-size:16px}
.remote .m{font-size:13px;color:var(--mist);text-align:start}
.remote .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.remote button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#102339;color:var(--snow);font:600 16px var(--f-b);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .25s,border-color .25s,color .25s}
.remote button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,#102339);color:#fff}
.remote button:hover{border-color:var(--acc)}
.hint{position:absolute;bottom:calc(3% + 8px);inset-inline-end:2%;font-size:13px;color:var(--mist);max-width:18ch;text-align:end}

/* band */
.band{border-block:1px solid var(--line);background:linear-gradient(90deg,var(--deep),#0A1828)}
.band .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:24px 20px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font:700 42px/1 var(--f-d);color:var(--snow)}
.stat span{color:var(--mist);font-size:15px}

section{position:relative;padding-block:96px}
.sec-head{display:grid;gap:14px;margin-bottom:44px;max-width:780px}
.sec-head p{color:var(--mist);max-width:58ch}

/* climate scroll: outside -> inside */
.climate{height:220vh;padding:0}
.climate .pin{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden;--p:0}
.climate .sky{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,rgb(calc(240 - var(--p)*170) calc(120 + var(--p)*45) calc(40 + var(--p)*190) / .55),transparent 75%),linear-gradient(180deg,#0B1320,var(--night))}
.climate .heatwave{position:absolute;inset:0;opacity:calc(1 - var(--p)*1.3);background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,170,80,.07) 22px 24px);filter:blur(1px);animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:0 48px}}
.climate .inner{position:relative;text-align:center;display:grid;gap:10px;justify-items:center;padding-inline:var(--gut)}
.climate .lbl{font-size:clamp(18px,2vw,22px);color:var(--snow);opacity:.85}
.climate .deg{font:300 clamp(140px,26vw,320px)/.85 var(--f-d);letter-spacing:-.05em;direction:ltr;font-variant-numeric:tabular-nums}
.climate .deg sup{font-size:.3em;vertical-align:top;margin-inline-start:.04em}
.climate .cap{font:300 clamp(22px,2.8vw,34px)/1.3 var(--f-d);max-width:22ch}
.climate .meter{width:min(440px,80vw);height:6px;border-radius:6px;background:linear-gradient(90deg,#4FA3E8,#F5A33A);position:relative;margin-top:14px;direction:ltr}
.climate .meter i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;transform:translate(-50%,-50%);left:calc((1 - var(--p))*100%)}

/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}
.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,var(--panel),var(--deep));padding:clamp(20px,3vw,34px)}
.field{display:grid;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field>span{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--snow);font:600 16px var(--f-b);cursor:pointer;transition:all .2s}
.chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#06101C}
.range{display:flex;align-items:center;gap:16px}
.range output{font:500 28px var(--f-m);min-width:4.5ch;color:var(--acc-2)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--acc));outline-offset:8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 35%,transparent);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 35%,transparent)}
.result{display:grid;align-content:space-between;gap:20px;position:relative;overflow:hidden}
.result::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;top:-180px;inset-inline-end:-160px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent),transparent 65%);transition:background .8s}
.result .hp{font:900 clamp(96px,12vw,150px)/.8 var(--f-d);letter-spacing:-.04em;direction:ltr;text-align:right;position:relative}
.result .hp small{font-size:.26em;font-weight:500;letter-spacing:0;margin-inline-start:8px}
.result .btu{font:500 18px var(--f-m);color:var(--mist);position:relative}
.result .why{color:var(--mist);font-size:15px;position:relative}
.result .note{font-size:14px;color:var(--mist);border-top:1px solid var(--line);padding-top:14px;position:relative}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.svc article{position:relative;border:1px solid var(--line);border-radius:22px;padding:26px 24px 28px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 85%,transparent),transparent);display:grid;gap:10px;align-content:start;overflow:hidden;min-width:0;transition:border-color .35s,transform .35s cubic-bezier(.2,.7,.1,1)}
.svc article:hover{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));transform:translateY(-4px)}
.svc article::after{content:"";position:absolute;inset:auto -30% -60% auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%);opacity:0;transition:opacity .4s}
.svc article:hover::after{opacity:1}
.svc .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-2);transition:all .8s}
.svc .ic svg{width:26px;height:26px}
.svc h3{font:700 26px/1.1 var(--f-d)}
.svc p{color:var(--mist);font-size:16px}

/* store / gallery */
.store{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:repeat(2,minmax(220px,1fr));gap:14px}
.store figure{margin:0;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--panel);min-height:220px}
.store figure:first-child{grid-row:span 2}
.store img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.1,1)}
.store figure:hover img{transform:scale(1.04)}
.store figcaption{position:absolute;inset:auto 0 0;padding:40px 18px 14px;background:linear-gradient(transparent,rgba(4,10,18,.88));font-size:15px}
.store .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mist);font-size:15px}
.store .ph::before{content:"";position:absolute;inset:12px;border:1px dashed var(--line);border-radius:14px}
.brands{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center;color:var(--mist);font-size:15px}
.brands b{padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--snow);font-weight:600}
.attrs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.attrs span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc-2);font-size:15px;transition:all .8s}

/* quotes */
.quotes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.quotes figure{margin:0;padding:28px 26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel),var(--deep));display:grid;gap:18px;align-content:space-between;min-width:0}
.quotes figure:first-child{grid-row:span 2;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 26%,var(--panel)),var(--deep));transition:background .8s}
.quotes blockquote{margin:0;font-size:18px;line-height:1.65}
.quotes figure:first-child blockquote{font:500 clamp(26px,3vw,38px)/1.25 var(--f-d)}
.quotes figcaption{display:flex;justify-content:space-between;gap:10px;color:var(--mist);font-size:15px}
.quotes .st{color:var(--warm);letter-spacing:2px}
.allrev{display:inline-flex;margin-top:18px;color:var(--mist);font-size:15px;min-height:44px;align-items:center}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.step{position:relative;padding:24px 22px;border-radius:22px;border:1px solid var(--line);display:grid;gap:8px;align-content:start;min-width:0}
.step .n{font:900 56px/.9 var(--f-d);color:transparent;-webkit-text-stroke:1.2px var(--acc);transition:-webkit-text-stroke-color .8s}
.step h3{font:700 24px/1.1 var(--f-d)}
.step p{color:var(--mist);font-size:16px}

/* visit */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.area{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.area span{padding:9px 16px;border:1px solid var(--line);border-radius:999px;font-size:16px}
.area span.home{border-color:var(--acc);color:var(--acc-2)}
.hours{display:grid;border-top:1px solid var(--line);margin-top:16px}
.hours div{display:flex;justify-content:space-between;gap:16px;padding:13px 2px;border-bottom:1px solid var(--line)}
.hours div span:last-child{color:var(--mist);direction:ltr;unicode-bidi:isolate}
.addr{color:var(--mist);margin-top:8px}
.today{font-size:14px;color:var(--acc-2);margin-top:10px;min-height:1em}

.final{text-align:center;overflow:hidden;isolation:isolate}
.final::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 60% at 50% 100%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);transition:background .8s}
.final h2{font-size:clamp(48px,8vw,104px)}
.final .ctas{justify-content:center;margin-top:28px}
.final .phone-big{display:block;margin-top:18px;font:500 22px var(--f-m);color:var(--mist);direction:ltr}

/* offer (demo only) */
.offer{background:linear-gradient(180deg,var(--deep),var(--night));border-top:1px solid var(--line)}
.offer-card{border:1px solid var(--line);border-radius:26px;padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;background:color-mix(in srgb,var(--night) 70%,transparent)}
.price{display:flex;align-items:flex-end;gap:10px;margin:18px 0 6px}
.price b{font:900 clamp(84px,11vw,132px)/.8 var(--f-d)}
.price span{color:var(--mist);padding-bottom:10px}
.renew{color:var(--mist);font-size:15px}
.inc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.inc li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:16px}
.inc li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--acc-2);box-shadow:0 0 8px var(--acc-2)}
.inc li.bonus b{color:var(--warm);font-weight:600}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
.terms div{border:1px solid var(--line);border-radius:18px;padding:18px}
.terms b{display:block;font:700 22px/1.1 var(--f-d);margin-bottom:6px}
.terms p{color:var(--mist);font-size:15px}
.offer .switch{margin-top:20px;color:var(--mist);font-size:16px;max-width:62ch}

footer{border-top:1px solid var(--line);padding-block:28px 110px;color:var(--mist);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar{position:fixed;inset:auto 0 0;z-index:55;display:none;gap:10px;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut);background:color-mix(in srgb,var(--night) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .btn{flex:1;min-height:52px;font-size:17px;padding:0 14px}

.rv{transition:transform .9s cubic-bezier(.2,.7,.1,1),opacity .9s}
.rv.pre{transform:translateY(26px);opacity:.001}

@media (max-width:960px){
  .hero .wrap{grid-template-columns:1fr}
  .unit-stage{max-width:460px;width:100%;margin-inline:auto}
  .band .wrap{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-inline-start:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .calc,.two,.offer-card,.quotes{grid-template-columns:1fr}
  .quotes figure:first-child{grid-row:auto}
  .svc{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .store{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .store figure:first-child{grid-column:span 2;grid-row:auto;aspect-ratio:4/3}
  .bar{display:flex}
  .hdr-phone .lbl-call{display:none}
}
@media (max-width:520px){
  section{padding-block:68px}
  .svc,.steps,.terms{grid-template-columns:1fr}
  .store{grid-template-columns:1fr}
  .store figure:first-child{grid-column:auto}
  .stat b{font-size:34px}
  .hint{display:none}
  .climate{height:180vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv.pre{transform:none;opacity:1}
  .climate{height:auto}
  .climate .pin{position:relative;height:auto;padding-block:96px;--p:1}
}

      </div>
      <div class="card result rv" aria-live="polite">
        <div><span class="eyebrow">ההערכה שלנו</span>
          <div class="hp" id="r-hp">2<small>כ״ס</small></div>
          <div class="btu" id="r-btu">כ-18,000 BTU</div></div>
        <p class="why" id="r-why"></p>
        <a class="btn btn-cta" id="r-wa" href="${wa}" target="_blank" rel="noopener">${I.wa}לשלוח את זה ל${esc(S.ownerFirst||"עסק")} לבדיקה</a>
        <p class="note">הערכה כללית בלבד. ההמלצה הסופית נקבעת אחרי שרואים את החלל: גובה תקרה, חלונות, בידוד וכמה אנשים בחדר.</p>
      </div>
    </div>
  </div></section>

  <section id="services" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv"><span class="eyebrow">מה יש אצלנו</span><h2>${esc(S.servicesTitle || "מיזוג, מהבחירה ועד ההתקנה")}</h2><p>${esc(S.servicesIntro||"")}</p></div>
    <div class="svc">${svc}</div>
  </div></section>

  <section id="store" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv"><span class="eyebrow">${esc(S.storeEyebrow || "החנות")}</span><h2>${esc(S.storeTitle || "בואו לראות")}</h2><p>${esc(S.storeIntro||"")}</p></div>
    <div class="store">${store}</div>
    ${(S.brands||[]).length?`<div class="brands rv"><span>${esc(S.brandsLabel||"על השלט:")}</span>${S.brands.map(b=>`<b>${esc(b)}</b>`).join("")}</div>`:""}
    ${(S.attrs||[]).length?`<div class="attrs rv">${S.attrs.map(a=>`<span>${I.box.replace('<svg','<svg width="16" height="16"')}${esc(a)}</span>`).join("")}</div>`:""}
  </div></section>

  ${quotes ? `<section id="reviews" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv"><span class="eyebrow">${S.rating ? S.rating.toFixed(1)+" · " : ""}${S.reviews||""} ביקורות בגוגל</span><h2>${esc(S.quotesTitle || "מה כותבים הלקוחות")}</h2></div>
    <div class="quotes">${quotes}</div>
    ${S.googleUrl?`<a class="allrev" href="${esc(S.googleUrl)}" target="_blank" rel="noopener">לכל הביקורות בגוגל ←</a>`:""}
  </div></section>` : ""}

  <section id="process" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv"><span class="eyebrow">איך זה עובד</span><h2>${esc(S.stepsTitle||"מהודעה ועד מזגן שעובד")}</h2></div>
    <div class="steps">${steps}</div>
  </div></section>

  <section id="visit" style="padding-top:0"><div class="wrap two">
    <div class="card rv"><span class="eyebrow">איפה אנחנו</span><h2 style="font-size:clamp(32px,4vw,48px);margin-top:10px">${esc(S.visitTitle||"מגיעים אליכם")}</h2>
      ${S.address?`<p class="addr">${esc(S.address)}</p>`:""}
      <div class="area">${area}</div>
      ${S.waze?`<div class="ctas" style="margin-top:22px"><a class="btn btn-ghost" href="${esc(S.waze)}" target="_blank" rel="noopener">${I.pin}ניווט לחנות</a></div>`:""}
    </div>
    <div class="card rv"><span class="eyebrow">שעות</span><h2 style="font-size:clamp(32px,4vw,48px);margin-top:10px">מתי פתוח</h2>
      <div class="hours">${hours}</div><p class="today" id="today"></p>
    </div>
  </div></section>

  <section class="final"><div class="wrap rv">
    <span class="eyebrow">${esc(S.trade)} · ${esc(S.city)}</span>
    <h2 style="margin-top:14px">${esc(S.finalTitle || "רוצים שיהיה נעים בבית?")}</h2>
    <div class="ctas"><a class="btn btn-cta" href="${wa}" target="_blank" rel="noopener">${I.wa}שלחו הודעה בוואטסאפ</a></div>
    <span class="phone-big">${esc(S.phone)}</span>
  </div></section>

  ${S.demo ? `
  <section class="offer" id="offer"><div class="wrap">
    <div class="sec-head rv"><span class="eyebrow">ההצעה ל${esc(S.offerTo||S.ownerFirst||S.business)} · לא חלק מהאתר</span><h2>${esc(O.title || "")}</h2></div>
    <div class="offer-card rv">
      <div>
        <p style="color:var(--mist);max-width:52ch">${esc(O.lead || "")}</p>
        <div class="price"><b class="mono">${esc(O.price)}</b><span>₪ לשנה הראשונה, הכל כלול</span></div>
        <p class="renew">${esc(O.renewal || "")}</p>
        ${O.sellerPhoneIntl ? `<div class="ctas" style="margin-top:24px"><a class="btn btn-cta" href="https://wa.me/${esc(O.sellerPhoneIntl)}?text=${encodeURIComponent(O.sellerWaText || ("היי, ראיתי את האתר לדוגמה של "+S.business+". רוצה שיעלה לאוויר"))}" target="_blank" rel="noopener">${I.wa}${esc(O.cta || "אני רוצה את האתר")}</a></div>`:""}
      </div>
      <ul class="inc">${inc}</ul>
    </div>
    <div class="terms">${terms}</div>
    ${O.switchNote ? `<p class="switch rv">${esc(O.switchNote)}</p>`:""}
  </div></section>`:""}
  </main>

  <footer><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(S.business)}</span><span>${esc(S.address||S.city)} · <span class="mono">${esc(S.phone)}</span></span></div></footer>
  <div class="bar"><a class="btn btn-cta" href="${wa}" target="_blank" rel="noopener">${I.wa}וואטסאפ</a><a class="btn btn-ghost" href="tel:${esc(S.phone)}">${I.phone}חיוג</a></div>`;

  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- mode + remote ---- */
  let mode = "cool", temp = 24;
  const paint = () => {
    document.body.classList.toggle("heat", mode==="heat");
    $("rt").textContent = temp; $("disp-t").textContent = temp;
    $("rm").textContent = mode==="heat" ? "חימום" : "קירור";
    $("b-cool").setAttribute("aria-pressed", mode==="cool"); $("b-heat").setAttribute("aria-pressed", mode==="heat");
  };
  $("b-cool").onclick = () => { mode="cool"; if(temp>25) temp=24; paint(); };
  $("b-heat").onclick = () => { mode="heat"; if(temp<22) temp=23; paint(); };
  $("b-up").onclick = () => { temp=Math.min(30,temp+1); paint(); };
  $("b-dn").onclick = () => { temp=Math.max(16,temp-1); paint(); };

  /* ---- airflow canvas ---- */
  const cv = $("air"), ctx = cv.getContext("2d"), stage = $("stage");
  let W=0,H=0,dpr=Math.min(2,devicePixelRatio||1), parts=[], running=true;
  const size = () => { const r=stage.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  size(); addEventListener("resize", size);
  const spawn = () => {
    const u=Math.random(), x0 = W*(.1+u*.8);
    parts.push({x:x0, y:H*.31, vx:(u-.5)*1.1, vy:1.5+Math.random()*1, life:0, max:120+Math.random()*90, w:.7+Math.random()*1.1, ph:Math.random()*6.28});
  };
  const col = () => mode==="heat" ? [255,178,90] : [140,205,255];
  let t=0;
  const tick = () => {
    if(!running){ requestAnimationFrame(tick); return; }
    t+=1; ctx.clearRect(0,0,W,H);
    const intensity = mode==="heat" ? (temp-15)/15 : (31-temp)/15;
    const n = reduce ? 0 : Math.round(2+intensity*4);
    for(let i=0;i<n;i++) spawn();
    const [r,g,b] = col();
    ctx.lineCap="round";
    parts = parts.filter(p=>p.life<p.max);
    for(const p of parts){
      p.life++; const k=p.life/p.max;
      const sw = Math.sin(t*.012)*.9;
      const px=p.x, py=p.y;
      p.vx += Math.sin(p.ph + p.life*.02)*.012 + sw*.01; p.x+=p.vx; p.y+=p.vy*(1-k*.4);
      const a = Math.sin(Math.PI*k)*.42;
      ctx.strokeStyle=`rgba(${r},${g},${b},${a})`; ctx.lineWidth=p.w;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(p.x+(p.x-px)*14,p.y+(p.y-py)*14); ctx.stroke();
    }
    requestAnimationFrame(tick);
  };
  if("IntersectionObserver" in window) new IntersectionObserver(es=>{running=es[0].isIntersecting}).observe(stage);
  if(!reduce) requestAnimationFrame(tick);
  paint();

  /* ---- climate scroll ---- */
  const cl = $("climate"), pin = cl.querySelector(".pin");
  const onScroll = () => {
    const r = cl.getBoundingClientRect(), span = r.height - innerHeight;
    const p = Math.max(0, Math.min(1, -r.top / (span||1)));
    const e = p<.15?0:p>.85?1:(p-.15)/.7;
    pin.style.setProperty("--p", e.toFixed(3));
    $("cl-deg").textContent = Math.round(C.out - (C.out-C.in)*e);
    const second = e>.5;
    $("cl-lbl").textContent = second ? C.b : C.a;
    $("cl-cap").textContent = second ? C.capB : C.capA;
  };
  if(!reduce){ addEventListener("scroll", onScroll, {passive:true}); onScroll(); }
  else { $("cl-deg").textContent=C.in; $("cl-lbl").textContent=C.b; $("cl-cap").textContent=C.capB; }

  /* ---- calculator ---- */
  const chipGroup = id => { const g=$(id); g.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); calc(); }); };
  ["c-room","c-sun","c-top"].forEach(chipGroup);
  const sel = id => $(id).querySelector('[aria-pressed="true"]');
  const fmt = n => n.toLocaleString("en-US");
  const calc = () => {
    const area = +$("c-area").value; $("c-area-o").textContent = area+" מ״ר";
    const room = sel("c-room"), sun = sel("c-sun"), top = sel("c-top");
    const btu = area*560*(+room.dataset.f)*(+sun.dataset.f)*(+top.dataset.f);
    let pick = sizes.find(s=>s[1]>=btu*.95);
    let hpTxt, btuTxt, why;
    if(!pick){
      hpTxt = "מיני"; btuTxt = "מעל "+fmt(sizes[sizes.length-1][1])+" BTU";
      why = `${area} מ״ר זה כבר שטח למיני מרכזי או לשתי יחידות. כדאי שיבואו לראות.`;
    } else {
      hpTxt = String(pick[0]); btuTxt = "כ-"+fmt(pick[1])+" BTU";
      why = `${room.textContent}, ${area} מ״ר, ${sun.textContent==="רגיל"?"שמש רגילה":sun.textContent}${top.textContent==="כן"?", קומה אחרונה":""}.`;
    }
    $("r-hp").innerHTML = hpTxt==="מיני" ? `מיני<small>מרכזי</small>` : `${hpTxt}<small>כ״ס</small>`;
    $("r-btu").textContent = btuTxt; $("r-why").textContent = why;
    const msg = `שלום${S.ownerFirst?" "+S.ownerFirst:""}, הגעתי מהאתר. ${why} יצא לי ${hpTxt==="מיני"?"מיני מרכזי":hpTxt+" כ״ס"}. אפשר לבדוק מה מתאים?`;
    $("r-wa").href = waBase + encodeURIComponent(msg);
  };
  $("c-area").addEventListener("input", calc); calc();

  /* ---- open now ---- */
  if(S.open){ const d=new Date(), w=d.getDay(), m=d.getHours()*60+d.getMinutes(), o=S.open[w];
    $("today").textContent = o && m>=o[0] && m<o[1] ? "● פתוח עכשיו" : ""; }

  /* ---- reveal ---- */
  if (!reduce && "IntersectionObserver" in window){
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("pre"); io.unobserve(e.target);} }),{rootMargin:"0px 0px -8% 0px"});
    document.querySelectorAll(".rv").forEach(el=>{ if(el.getBoundingClientRect().top > innerHeight){ el.classList.add("pre"); io.observe(el);} });
  }
})();
</script>


</body>
</html>
