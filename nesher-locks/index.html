<style>
/* Layout: dark technical "cross-section" sheet. Signature motif = a laser-level line with measurement ticks, drawn in every section. */
:root{
  --ink:#0C1015;        /* page */
  --sheet:#131921;      /* raised surfaces */
  --rule:#26313D;       /* hairlines, grid */
  --steel:#8C9AAB;      /* secondary text */
  --paper:#ECEFF3;      /* primary text */
  --laser:#9FD8FF;      /* motif line, never on buttons */
  --amber:#FFB238;      /* primary action only */
  --amber-ink:#1A1206;
  --f-display:"Karantina","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--paper);font:400 18px/1.6 var(--f-body);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
/* grain + blueprint grid */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.grid-bg{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:56px 56px;background-position:center}
a{color:inherit}
:focus-visible{outline:2px solid var(--laser);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);position:relative;z-index:2}
.mono{font-family:var(--f-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.eyebrow{font:500 13px/1.2 var(--f-body);letter-spacing:.14em;color:var(--steel)}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font:700 clamp(44px,7vw,84px)/.92 var(--f-display);letter-spacing:.01em}
p{margin:0}

/* demo ribbon */
.ribbon{position:relative;z-index:61;background:var(--sheet);border-bottom:1px solid var(--rule);font-size:14px;color:var(--steel)}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.ribbon b{color:var(--paper);font-weight:600}
.ribbon a{color:var(--laser);text-decoration:none;white-space:nowrap}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--ink) 78%,transparent);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--rule)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand strong{font:700 28px/1 var(--f-display);letter-spacing:.02em}
.brand span{font-size:13px;color:var(--steel)}
.hdr-phone{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;color:var(--paper);min-height:44px}
.hdr-phone .mono{font-size:15px}

/* laser line motif */
.laser{position:relative;height:22px;margin-block:0;overflow:hidden}
.laser::before{content:"";position:absolute;inset:10px 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--laser) 18%,var(--laser) 82%,transparent);box-shadow:0 0 12px 1px color-mix(in srgb,var(--laser) 55%,transparent);transform-origin:right;animation:draw 1.6s cubic-bezier(.2,.7,.1,1) both}
.laser::after{content:"";position:absolute;inset:4px 0 auto;height:13px;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 28px);opacity:.9}
.laser .dot{position:absolute;top:6px;width:9px;height:9px;border-radius:50%;background:var(--laser);box-shadow:0 0 14px 3px var(--laser);animation:travel 7s ease-in-out infinite alternate}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes travel{from{right:4%}to{right:94%}}

/* hero */
.hero{position:relative;padding-block:56px 40px;overflow:hidden}
.hero .grid-bg{position:absolute;inset:0;opacity:.35;mask-image:radial-gradient(ellipse 70% 70% at 30% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 70% 70% at 30% 40%,#000 20%,transparent 75%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero-copy{min-width:0;display:grid;gap:22px;position:relative;z-index:2}
.hero h1{font:700 clamp(64px,10vw,132px)/.86 var(--f-display);letter-spacing:.005em}
.hero h1 .trade{display:block;font-size:.36em;line-height:1.1;font-weight:400;color:var(--laser);margin-top:.25em;letter-spacing:.04em}
.hero .tag{font-size:clamp(19px,2.2vw,23px);color:var(--paper);max-width:32ch}
.hero .lede{color:var(--steel);max-width:52ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;font:700 18px/1 var(--f-body);text-decoration:none;cursor:pointer;border:0;transition:transform .25s cubic-bezier(.2,.7,.1,1),box-shadow .25s}
.btn-wa{background:var(--amber);color:var(--amber-ink);box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 60%,#000),0 10px 40px -8px color-mix(in srgb,var(--amber) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--amber),0 16px 50px -6px color-mix(in srgb,var(--amber) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid var(--rule)}
.btn-ghost:hover{border-color:var(--steel)}
.btn svg{width:22px;height:22px;flex:none}
.rating{display:inline-flex;align-items:center;gap:14px;padding:10px 16px 10px 18px;border:1px solid var(--rule);border-radius:14px;background:color-mix(in srgb,var(--sheet) 80%,transparent);text-decoration:none;width:fit-content}
.rating .score{font:700 40px/1 var(--f-display)}
.rating .stars{color:var(--laser);letter-spacing:2px;font-size:15px}
.rating small{display:block;color:var(--steel);font-size:14px}

/* hero drawing */
.drawing{position:relative;aspect-ratio:1/1;max-width:100%;perspective:1000px}
.drawing-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.drawing svg{width:100%;height:100%;overflow:visible}
.drawing .ln{fill:none;stroke:var(--steel);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.75}
.drawing .ln-soft{fill:none;stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.drawing .pipe{fill:none;stroke:var(--laser);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 8;animation:flow 2.4s linear infinite}
.drawing .lbl{font:500 11px var(--f-mono);fill:var(--steel)}
@keyframes turn{0%,20%{transform:rotate(0)}45%,70%{transform:rotate(-90deg)}95%,100%{transform:rotate(0)}}@keyframes flow{to{stroke-dashoffset:-56}}
.plane{position:absolute;inset:0;pointer-events:none}
.plane i{position:absolute;inset-inline:6%;height:2px;background:var(--laser);box-shadow:0 0 18px 4px color-mix(in srgb,var(--laser) 70%,transparent),0 0 60px 10px color-mix(in srgb,var(--laser) 25%,transparent);animation:sweep 6s cubic-bezier(.45,0,.55,1) infinite alternate;opacity:.85}
@keyframes sweep{from{top:18%}to{top:82%}}
.readout{position:absolute;bottom:4%;left:4%;font:500 12px var(--f-mono);color:var(--laser);background:color-mix(in srgb,var(--ink) 85%,transparent);border:1px solid var(--rule);padding:6px 10px;border-radius:6px;direction:ltr}

/* stats band */
.band{border-block:1px solid var(--rule);background:var(--sheet)}
.band .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:0}
.stat{padding:22px 20px;border-inline-start:1px solid var(--rule);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font:700 44px/1 var(--f-display)}
.stat span{color:var(--steel);font-size:15px}

section{position:relative;padding-block:88px}
.sec-head{display:grid;gap:14px;margin-bottom:40px;max-width:760px}
.sec-head p{color:var(--steel);max-width:58ch}

/* services as spec sheet */
.specs{border-top:1px solid var(--rule)}
.spec{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr) auto;gap:24px;align-items:baseline;padding:26px 4px;border-bottom:1px solid var(--rule);position:relative}
.spec::after{content:"";position:absolute;bottom:-1px;right:0;height:1px;width:100%;background:var(--laser);box-shadow:0 0 10px var(--laser);transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.spec:hover::after{transform:scaleX(1)}
.spec h3{font:700 clamp(32px,3.6vw,44px)/1 var(--f-display)}
.spec p{color:var(--steel)}
.spec .code{font:500 12px var(--f-mono);color:var(--steel);opacity:.7}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.steps::before{content:"";position:absolute;top:27px;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,var(--laser) 10%,var(--laser) 90%,transparent);box-shadow:0 0 10px var(--laser);opacity:.7}
.step{padding-inline-end:24px;display:grid;gap:10px;min-width:0}
.step .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ink);border:1px solid var(--laser);font:700 28px/1 var(--f-display);color:var(--laser);position:relative;z-index:1;box-shadow:0 0 20px -4px var(--laser)}
.step h3{font:700 30px/1 var(--f-display);margin-top:8px}
.step p{color:var(--steel);font-size:16px}

/* gallery */
/* reviews: verbatim quotes on a measured rule */
.quotes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.quotes figure{margin:0;padding:26px 24px;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);display:grid;gap:16px;align-content:space-between;min-width:0;position:relative;overflow:hidden}
.quotes figure:first-child{grid-row:span 2}
.quotes figure::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--laser),transparent);box-shadow:0 0 12px var(--laser);opacity:.8}
.quotes blockquote{margin:0;font-size:18px;line-height:1.65}
.quotes figure:first-child blockquote{font:700 clamp(28px,3.4vw,40px)/1.15 var(--f-display)}
.quotes figcaption{display:flex;justify-content:space-between;gap:10px;color:var(--steel);font-size:15px}
.quotes .st{color:var(--laser);letter-spacing:2px}
.allrev{display:inline-flex;margin-top:18px;color:var(--steel);font-size:15px;min-height:44px;align-items:center}
@media (max-width:900px){.quotes{grid-template-columns:1fr}.quotes figure:first-child{grid-row:auto}}
.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-auto-rows:220px;gap:14px}
.gallery figure{margin:0;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:var(--sheet)}
.gallery figure:first-child{grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) contrast(1.05)}
.gallery .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--steel);font-size:15px}
.gallery .ph::before{content:"";position:absolute;inset:12px;border:1px dashed var(--rule);border-radius:8px}
.gallery .ph .mono{display:block;font-size:11px;margin-bottom:6px;color:var(--laser);opacity:.8}

/* area */
.area{display:flex;flex-wrap:wrap;gap:10px}
.area span{padding:10px 18px;border:1px solid var(--rule);border-radius:999px;font-size:16px}
.area span.home{border-color:var(--laser);color:var(--laser)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.hours{display:grid;gap:0;border-top:1px solid var(--rule)}
.hours div{display:flex;justify-content:space-between;gap:16px;padding:14px 2px;border-bottom:1px solid var(--rule)}
.hours div span:last-child{color:var(--steel)}

/* final cta */
.final{text-align:center;overflow:hidden}
.final h2{font-size:clamp(56px,10vw,128px)}
.final .ctas{justify-content:center;margin-top:28px}
.final .phone-big{display:block;margin-top:18px;font:500 22px var(--f-mono);color:var(--steel);direction:ltr}

/* offer for owner (demo only) */
.offer{background:linear-gradient(180deg,var(--sheet),var(--ink));border-top:1px solid var(--rule)}
.offer-card{border:1px solid var(--rule);border-radius:22px;padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;background:color-mix(in srgb,var(--ink) 70%,transparent)}
.price{display:flex;align-items:flex-end;gap:10px;margin:18px 0 6px}
.price b{font:700 clamp(84px,11vw,132px)/.8 var(--f-display)}
.price span{color:var(--steel);padding-bottom:10px}
.renew{color:var(--steel);font-size:15px}
.inc{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.inc li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule);font-size:16px}
.inc li::before{content:"";flex:none;width:14px;height:1px;margin-top:13px;background:var(--laser);box-shadow:0 0 8px var(--laser)}
.inc li.bonus b{color:var(--laser);font-weight:600}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.terms div{border:1px solid var(--rule);border-radius:14px;padding:16px}
.terms b{display:block;font:700 26px/1.05 var(--f-display);margin-bottom:4px}
.terms p{color:var(--steel);font-size:15px}
.offer .switch{margin-top:20px;color:var(--steel);font-size:16px;max-width:60ch}

footer{border-top:1px solid var(--rule);padding-block:28px 110px;color:var(--steel);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* mobile action bar */
.bar{position:fixed;inset:auto 0 0;z-index:55;display:none;gap:10px;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut);background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule)}
.bar .btn{flex:1;min-height:52px;font-size:17px;padding:0 14px}

/* reveal: visible at rest, slides in */
.rv{transition:transform .9s cubic-bezier(.2,.7,.1,1),opacity .9s}
.rv.pre{transform:translateY(24px)}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  .drawing{max-width:420px;width:100%;margin-inline:auto}
  .band .wrap{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-inline-start:0}
  .stat:nth-child(n+3){border-top:1px solid var(--rule)}
  .spec{grid-template-columns:1fr;gap:6px}
  .spec .code{display:none}
  .steps{grid-template-columns:1fr 1fr;row-gap:32px}
  .steps::before{display:none}
  .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:160px}
  .two,.offer-card{grid-template-columns:1fr}
  .terms{grid-template-columns:1fr}
  .bar{display:flex}
  .hdr-phone .lbl-call{display:none}
}
@media (max-width:420px){
  section{padding-block:64px}
  .steps{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr;grid-auto-rows:200px}
  .gallery figure:first-child{grid-row:auto}
  .stat b{font-size:36px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv.pre{transform:none;opacity:1}
  .plane i{top:50%}
}
</style>

(function(){

  '.t3d-cap{position:absolute;z-index:2;inset-inline-start:max(16px,4vw);bottom:clamp(18px,5vh,44px);max-width:min(440px,calc(100% - 32px));padding:20px 22px;border-radius:18px;color:' + C.ink + ';background:color-mix(in srgb,' + C.bg1 + ' 58%,transparent);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid color-mix(in srgb,' + C.ink + ' 14%,transparent);display:grid;gap:8px}' +

  '.t3d-hint{display:inline-flex;align-items:center;gap:8px;font-size:13px;opacity:.65;margin-top:2px}' +

  '.t3d-hint i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:currentColor;animation:t3dp 1.8s ease-in-out infinite}' +
  '@keyframes t3dp{50%{transform:translateX(-4px)}}' +
  '.t3d-ui{position:absolute;z-index:2;inset-inline-end:max(16px,4vw);top:clamp(24px,5vh,40px);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}' +
  '.t3d-ui button{width:44px;height:44px;border-radius:50%;border:2px solid color-mix(in srgb,' + C.ink + ' 30%,transparent);cursor:pointer;padding:0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 6px 16px -6px rgba(0,0,0,.5);transition:transform .25s}' +
  '.t3d-ui button[aria-pressed="true"]{border-color:' + C.ink + ';transform:scale(1.12)}' +
  '.t3d-fallback{position:absolute;inset:0;display:grid;place-items:center;opacity:.5;color:' + C.ink + '}' +
  '@media (max-width:640px){.t3d-in{height:560px}.t3d-cap{bottom:14px;padding:16px}.t3d-cap p{font-size:15px}}' +
  '@media (prefers-reduced-motion:reduce){.t3d-hint i::after{animation:none}}';
  document.head.appendChild(css);
  var sec = document.createElement('section');
  sec.className = 't3d'; sec.setAttribute('aria-label', C.title);
  sec.innerHTML = '<div class="t3d-in"><canvas aria-hidden="true"></canvas>' + (C.swatches ? '<div class="t3d-ui" role="group" aria-label="צבע"></div>' : '') +
    '<div class="t3d-cap"><span class="t3d-eye">' + C.eyebrow + '</span><h2>' + C.title + '</h2><p>' + C.text + '</p><span class="t3d-hint"><i></i>' + (C.hint || 'גררו כדי לסובב') + '</span></div></div>';
  main.firstElementChild.after(sec);
  var canvas = sec.querySelector('canvas');

  function go(){
    var T = window.THREE;
    var R = new T.WebGLRenderer({canvas: canvas, antialias: !small, alpha: true, powerPreference: 'high-performance'});
    R.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : 2));
    R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = .86;

    // soft studio environment for reflections

    var eg = new T.SphereGeometry(20, 32, 16);

    for (var i = 0; i < eg.attributes.position.count; i++){ var y = eg.attributes.position.getY(i)/20; var c = bot.clone().lerp(top, (y+1)/2*.6); ec.push(c.r, c.g, c.b); }
    eg.setAttribute('color', new T.Float32BufferAttribute(ec, 3));
    env.add(new T.Mesh(eg, new T.MeshBasicMaterial({vertexColors: true, side: T.BackSide})));
    [[-6,6,4,8,3],[7,3,-3,4,6],[0,9,-6,10,2]].forEach(function(p){ var m = new T.Mesh(new T.PlaneGeometry(p[3], p[4]), new T.MeshBasicMaterial({color: 0xcccccc, side: T.DoubleSide})); m.position.set(p[0],p[1],p[2]); m.lookAt(0,0,0); env.add(m); });
    var am = new T.Mesh(new T.PlaneGeometry(5,5), new T.MeshBasicMaterial({color: A, side: T.DoubleSide})); am.position.set(-8,1,-4); am.lookAt(0,0,0); env.add(am);
    var pm = new T.PMREMGenerator(R); S.environment = pm.fromScene(env, .04).texture;

    S.add(new T.HemisphereLight(0xffffff, col(C.bg1), .55));
    var key = new T.DirectionalLight(0xffffff, 1.6); key.position.set(4, 6, 5); S.add(key);
    var rim = new T.PointLight(A, 2.2, 18); rim.position.set(-4, 2.5, -3); S.add(rim);

    // contact shadow
    var sc = document.createElement('canvas'); sc.width = sc.height = 128; var sx = sc.getContext('2d');
    var gr = sx.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)'); sx.fillStyle = gr; sx.fillRect(0,0,128,128);
    var shadow = new T.Mesh(new T.PlaneGeometry(6, 6), new T.MeshBasicMaterial({map: new T.CanvasTexture(sc), transparent: true, depthWrite: false}));
    shadow.rotation.x = -Math.PI/2; shadow.position.y = -1.5; S.add(shadow);

    var G = new T.Group(); S.add(G);
    var M = {
      metal: function(c, r){ return new T.MeshStandardMaterial({color: c, metalness: 1, roughness: r == null ? .25 : r}); },
      paint: function(c){ return new T.MeshPhysicalMaterial({color: c, metalness: .3, roughness: .3, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: .9}); },
      matte: function(c, r){ return new T.MeshStandardMaterial({color: c, metalness: 0, roughness: r == null ? .6 : r}); },
      glow: function(c, k){ return new T.MeshStandardMaterial({color: c, emissive: c, emissiveIntensity: k || 2, roughness: .4}); },
      glass: function(o){ return new T.MeshPhysicalMaterial({color: 0xffffff, metalness: 0, roughness: .04, transmission: .92, transparent: true, opacity: o || .35, ior: 1.4, thickness: .2}); }
    };
    var glowTex = (function(){ var c = document.createElement('canvas'); c.width = c.height = 128; var x = c.getContext('2d'); var g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.25,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0,0,128,128); return new T.CanvasTexture(c); })();
    var glowSprite = function(c, s){ var sp = new T.Sprite(new T.SpriteMaterial({map: glowTex, color: c, transparent: true, blending: T.AdditiveBlending, depthWrite: false})); sp.scale.set(s, s, 1); return sp; };
    var rb = function(w, h, d, r){ var s = new T.Shape(), x = -w/2, y = -h/2; s.moveTo(x+r, y); s.lineTo(x+w-r, y); s.quadraticCurveTo(x+w, y, x+w, y+r); s.lineTo(x+w, y+h-r); s.quadraticCurveTo(x+w, y+h, x+w-r, y+h); s.lineTo(x+r, y+h); s.quadraticCurveTo(x, y+h, x, y+h-r); s.lineTo(x, y+r); s.quadraticCurveTo(x, y, x+r, y);
      var g = new T.ExtrudeGeometry(s, {depth: d - r*.6, bevelEnabled: true, bevelThickness: r*.3, bevelSize: r*.3, bevelSegments: 4, curveSegments: 8}); g.center(); return g; };
    var tick = []; // per-frame updaters (t, dt)
    var camPos = [0, 1.2, 9], look = [0, 0, 0], spin = .18;

    var K = {
      bulb: function(){
        var bulb = new T.Group(); G.add(bulb);
        var pts = []; for (var i = 0; i <= 24; i++){ var a = i/24*Math.PI; pts.push(new T.Vector2(Math.sin(a)*1.25*(i>14?1-(i-14)/30:1), -Math.cos(a)*1.25)); }
        pts.push(new T.Vector2(.55, 1.55), new T.Vector2(.55, 1.9));
        var glass = new T.Mesh(new T.LatheGeometry(pts, 64), new T.MeshPhysicalMaterial({color: 0xffffff, metalness: 0, roughness: .02, transparent: true, opacity: .1, clearcoat: 1, envMapIntensity: 2.5, depthWrite: false})); bulb.add(glass); var halo1 = glowSprite(A, 3.4), halo2 = glowSprite(A2, 6.5); halo2.material.opacity = .25; bulb.add(halo1, halo2);
        for (var k = 0; k < 6; k++){ var r = new T.Mesh(new T.TorusGeometry(.56, .07, 12, 48), M.metal('#c9c3b5', .3)); r.rotation.x = Math.PI/2; r.position.y = 1.98 + k*.15; bulb.add(r); }
        var cap = new T.Mesh(new T.CylinderGeometry(.5, .28, .35, 32), M.metal('#2b2b2b', .5)); cap.position.y = 2.9; bulb.add(cap);
        var coil = []; for (var j = 0; j <= 160; j++){ var u = j/160, ang = u*Math.PI*14; coil.push(new T.Vector3(-.55 + u*1.1, .05 + Math.sin(ang)*.09, Math.cos(ang)*.09)); }
        var fil = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(coil), 300, .022, 8), new T.MeshBasicMaterial({color: A})); fil.material.emissiveIntensity = 0; bulb.add(fil);
        [[-.55,.05],[.55,.05]].forEach(function(p){ var w = new T.Mesh(new T.CylinderGeometry(.018,.018,1.9,8), M.metal('#d0d0d0')); w.position.set(p[0]*.6, 1.0, 0); w.rotation.z = p[0] > 0 ? -.28 : .28; bulb.add(w); });
        var inner = new T.PointLight(A, 3, 8); inner.position.y = .1; bulb.add(inner);
        bulb.position.y = -.5; bulb.rotation.z = Math.PI; bulb.position.y = .9;
        // sparks
        var N = small ? 160 : 320, geo = new T.BufferGeometry(), P = new Float32Array(N*3), seed = [];
        for (var n = 0; n < N; n++){ seed.push([Math.random()*Math.PI*2, 1.7 + Math.random()*1.8, (Math.random()-.5)*3.2, .2 + Math.random()*.8]); }
        geo.setAttribute('position', new T.BufferAttribute(P, 3));
        var sp = new T.Points(geo, new T.PointsMaterial({color: A2, size: .045, transparent: true, opacity: .9, blending: T.AdditiveBlending, depthWrite: false})); S.add(sp);
        tick.push(function(t){ var f = .75 + .25*Math.sin(t*3.1) + .08*Math.sin(t*17); fil.material.emissiveIntensity = 2.4*f; inner.intensity = 3*f; halo1.material.opacity = .55 + .35*f; halo1.scale.setScalar(3 + .5*f);
          for (var n = 0; n < N; n++){ var s = seed[n], a = s[0] + t*s[3]*.6; P[n*3] = Math.cos(a)*s[1]; P[n*3+1] = s[2] + Math.sin(t*s[3] + n)*.15; P[n*3+2] = Math.sin(a)*s[1]; } geo.attributes.position.needsUpdate = true; });
        camPos = [0, .6, 9.5]; shadow.position.y = -1.9;
      },
      breakers: function(){
        var panel = new T.Mesh(rb(6.2, 3.6, .4, .18), M.matte('#e9ecef', .45)); panel.position.z = -.35; G.add(panel);
        var rail = new T.Mesh(new T.BoxGeometry(5.8, .32, .12), M.metal('#9aa3ad', .35)); rail.position.z = -.05; G.add(rail);
        var tog = [], leds = [];
        for (var i = 0; i < 8; i++){
          var x = -2.6 + i*.74, w = i === 0 ? .9 : .62;
          var b = new T.Mesh(rb(w, 1.9, .9, .06), M.matte(i === 0 ? '#1f2937' : '#f8f9fa', .35)); b.position.set(i === 0 ? x - .08 : x, 0, .3); G.add(b);
          var t2 = new T.Mesh(rb(.26, .42, .3, .05), M.matte(i === 0 ? '#e63946' : '#2b2f36', .4)); t2.position.set(b.position.x, 0, .85); G.add(t2); tog.push(t2);
          var l = new T.Mesh(new T.SphereGeometry(.06, 16, 16), M.glow(A, 0)); l.position.set(b.position.x, .72, .76); G.add(l); leds.push(l);
          var lab = new T.Mesh(new T.BoxGeometry(w*.7, .12, .01), M.matte('#c3c8ce')); lab.position.set(b.position.x, -.72, .76); G.add(lab);
        }
        tick.push(function(t){ var cyc = (t % 9)/9;
          tog.forEach(function(m, i){ var on = cyc > .08 + i*.075 && cyc < .9; var target = on ? .2 : -.2; m.position.y += (target - m.position.y)*.18; m.rotation.x += ((on ? -.35 : .35) - m.rotation.x)*.18; leds[i].material.emissiveIntensity += ((on ? 2.6 : 0) - leds[i].material.emissiveIntensity)*.15; }); });
        camPos = [0, .8, 8.2]; spin = .1; G.rotation.y = -.35;
      },
      lock: function(){
        var prof = new T.Shape(); prof.absarc(0, .55, .78, Math.PI*1.18, Math.PI*-.18, false); prof.lineTo(.42, -.9); prof.quadraticCurveTo(.42, -1.25, .1, -1.25); prof.lineTo(-.1, -1.25); prof.quadraticCurveTo(-.42, -1.25, -.42, -.9); prof.closePath();
        var hole = new T.Path(); hole.absarc(0, .55, .5, 0, Math.PI*2, true); prof.holes.push(hole);
        var body = new T.Mesh(new T.ExtrudeGeometry(prof, {depth: 2.6, bevelEnabled: true, bevelThickness: .05, bevelSize: .05, bevelSegments: 3, curveSegments: 48}), M.metal('#d4a94f', .28)); body.geometry.center(); body.rotation.y = Math.PI/2; G.add(body);
        var plug = new T.Mesh(new T.CylinderGeometry(.48, .48, 2.62, 48), M.metal('#c8c2b0', .22)); plug.rotation.z = Math.PI/2; plug.position.y = .55 - .15; G.add(plug);
        var ks = new T.Shape(); ks.moveTo(0, 0); var teeth = [.0,.16,.06,.2,.02,.14,.08,.18,0]; for (var i = 0; i < teeth.length; i++){ ks.lineTo(.3 + i*.26, .28 + teeth[i]); ks.lineTo(.43 + i*.26, .28 + teeth[(i+1)%teeth.length]*.5); } ks.lineTo(2.6, .12); ks.lineTo(2.6, 0); ks.lineTo(0, 0);
        var blade = new T.Mesh(new T.ExtrudeGeometry(ks, {depth: .07, bevelEnabled: true, bevelThickness: .015, bevelSize: .015, bevelSegments: 2}), M.metal('#e6e2d6', .18));
        var bow = new T.Mesh(new T.TorusGeometry(.42, .16, 24, 64), M.metal('#e6e2d6', .18)); bow.position.set(-.45, .14, .035);
        var head = new T.Mesh(rb(.5, .55, .2, .05), M.metal('#e6e2d6', .2)); head.position.set(-.05, .14, .035);
        var key = new T.Group(); key.add(blade, bow, head);
        var keyPivot = new T.Group(); keyPivot.position.set(1.32, .4, 0); keyPivot.add(key); key.position.set(0, -.14, -.035); key.rotation.y = Math.PI; G.add(keyPivot);
        var ring = new T.Mesh(new T.TorusGeometry(1.15, .012, 8, 120), M.glow(A, 2.2)); ring.rotation.y = Math.PI/2; ring.position.set(1.36, .4, 0); G.add(ring);
        tick.push(function(t){ var c = (t % 6)/6; var ins = c < .3 ? 1 - c/.3 : c < .8 ? 0 : (c - .8)/.2; key.position.x = ins*2.2 - .0; var rot = c > .38 && c < .72 ? Math.min(1, (c-.38)/.12) * (c > .6 ? Math.max(0, 1-(c-.6)/.12) : 1) : 0; keyPivot.rotation.x = -rot*Math.PI/2; plug.rotation.x = -rot*Math.PI/2; ring.material.emissiveIntensity = 1 + rot*3; ring.scale.setScalar(1 + rot*.08); });
        G.rotation.y = -.75; camPos = [0, 1.0, 7.4]; spin = .12; G.position.x = -.3;
      },
      washer: function(){
        var bs = new T.Shape(); (function(w,h,r){ var x=-w/2,y=-h/2; bs.moveTo(x+r,y); bs.lineTo(x+w-r,y); bs.quadraticCurveTo(x+w,y,x+w,y+r); bs.lineTo(x+w,y+h-r); bs.quadraticCurveTo(x+w,y+h,x+w-r,y+h); bs.lineTo(x+r,y+h); bs.quadraticCurveTo(x,y+h,x,y+h-r); bs.lineTo(x,y+r); bs.quadraticCurveTo(x,y,x+r,y); })(3, 3.6, .3);
        var bh = new T.Path(); bh.absarc(0, -.25, .95, 0, Math.PI*2, true); bs.holes.push(bh);
        var body = new T.Mesh(new T.ExtrudeGeometry(bs, {depth: 2.4, bevelEnabled: true, bevelThickness: .08, bevelSize: .08, bevelSegments: 4, curveSegments: 48}), M.matte('#f4f6f8', .3)); body.position.z = -1.2; G.add(body);
        var back = new T.Mesh(new T.CircleGeometry(.96, 48), M.matte('#1b1f24', .8)); back.position.set(0, -.25, -.2); G.add(back);
        var panel = new T.Mesh(new T.BoxGeometry(2.7, .55, .05), M.matte('#dfe3e8', .4)); panel.position.set(0, 1.42, 1.31); G.add(panel);
        var disp = new T.Mesh(new T.BoxGeometry(.8, .26, .02), M.glow(A, 1.6)); disp.position.set(-.3, 1.42, 1.35); G.add(disp);
        var knob = new T.Mesh(new T.CylinderGeometry(.17, .17, .14, 32), M.metal('#b9c0c8', .25)); knob.rotation.x = Math.PI/2; knob.position.set(.85, 1.42, 1.38); G.add(knob);
        var ring = new T.Mesh(new T.TorusGeometry(1.0, .12, 24, 96), M.metal('#cfd5dc', .18)); ring.position.set(0, -.25, 1.33); G.add(ring);
        var gl = new T.Mesh(new T.CircleGeometry(.95, 64), new T.MeshPhysicalMaterial({color: 0xbfe9ff, roughness: .02, transparent: true, opacity: .14, clearcoat: 1, envMapIntensity: 3})); gl.position.set(0, -.25, 1.36); G.add(gl);
        var drum = new T.Group(); drum.position.set(0, -.25, .55); G.add(drum); var dlight = new T.PointLight(A, 1.6, 4); dlight.position.set(0, -.25, .9); G.add(dlight);
        var dm = new T.Mesh(new T.CylinderGeometry(.92, .92, 1.1, 48, 1, true), M.metal('#7b8590', .35)); dm.material.side = T.DoubleSide; dm.rotation.x = Math.PI/2; drum.add(dm);
        for (var i = 0; i < 3; i++){ var lf = new T.Mesh(new T.BoxGeometry(.12, .25, 1), M.metal('#9aa3ad', .3)); var a = i/3*Math.PI*2; lf.position.set(Math.cos(a)*.82, Math.sin(a)*.82, 0); lf.rotation.z = a + Math.PI/2; drum.add(lf); }
        var cloth = []; ['#4c7cf3', '#f25c54', A.getStyle(), '#ffd166', '#06d6a0'].forEach(function(c, k){ var m = new T.Mesh(new T.IcosahedronGeometry(.26 + (k%2)*.06, 2), M.matte(c, .8)); drum.add(m); cloth.push(m); });
        var water = new T.Mesh(new T.CircleGeometry(.9, 48, Math.PI*1.1, Math.PI*.8), new T.MeshStandardMaterial({color: A2, transparent: true, opacity: .35, roughness: .1})); water.position.set(0, -.25, 1.2); G.add(water);
        tick.push(function(t, dt){ drum.rotation.z -= dt*3.2; cloth.forEach(function(m, k){ var a = -t*2.2 + k*1.25, r = .45 + .2*Math.sin(t*1.7 + k); m.position.set(Math.cos(a)*r, Math.sin(a)*r - .1, (k-2)*.15); m.rotation.set(t + k, t*1.3, 0); }); water.rotation.z = Math.sin(t*2)*.12; disp.material.emissiveIntensity = 1.4 + .4*Math.sin(t*4); knob.rotation.y = t*.5; });
        G.rotation.y = -.45; camPos = [0, .6, 9.2]; spin = .1;
      },
      gears: function(){
        var gear = function(R, n, th, c){ var s = new T.Shape(); for (var i = 0; i < n*2; i++){ var a0 = i/(n*2)*Math.PI*2, a1 = (i+1)/(n*2)*Math.PI*2, r = i%2 ? R : R + .22; if (i === 0) s.moveTo(Math.cos(a0)*r, Math.sin(a0)*r); s.lineTo(Math.cos(a0+.02)*r, Math.sin(a0+.02)*r); s.lineTo(Math.cos(a1-.02)*r, Math.sin(a1-.02)*r); }
          var h = new T.Path(); h.absarc(0, 0, R*.32, 0, Math.PI*2, true); s.holes.push(h);
          for (var k = 0; k < 5 && R > .8; k++){ var hp = new T.Path(), a = k/5*Math.PI*2; hp.absarc(Math.cos(a)*R*.62, Math.sin(a)*R*.62, R*.16, 0, Math.PI*2, true); s.holes.push(hp); }
          var g = new T.ExtrudeGeometry(s, {depth: th, bevelEnabled: true, bevelThickness: .03, bevelSize: .03, bevelSegments: 2, curveSegments: 24}); g.center(); return new T.Mesh(g, M.metal(c, .3)); };
        var g1 = gear(1.3, 22, .32, '#c9ced6'), g2 = gear(.78, 13, .32, A.getStyle()), g3 = gear(.55, 9, .32, '#d6b46a');
        g1.position.set(-.6, .1, 0); g2.position.set(1.52, .62, 0); g3.position.set(.55, -1.55, .2); G.add(g1, g2, g3);
        g2.material = M.paint(A);
