<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="מטבחים וארונות לחדרים בעפולה והעמק. הבעלים עובדים בעצמם, מקשיבים למה שצריך ומתאימים את התכנון לבית ולתקציב.">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>מטבחי גנדי | מטבחים ונגרות בעפולה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an architect's elevation sheet that turns into the real installed photo. Signature motif = a dimension line (ticks + measurement) under every section; a glass edge wipes drawing -> reality in the hero, and a full-bleed film of the client's own work follows. */
:root{
  --bg:#E9EDEC;        /* frosted glass page */
  --surface:#F5F7F6;   /* raised sheet */
  --fg:#15201F;        /* ink */
  --muted:#55625F;     /* secondary text */
  --line:#C9D3D0;      /* hairlines */
  --glass:#5E978D;     /* tempered-glass edge: motif lines only */
  --brass:#7E5F27;     /* primary action only */
  --on-brass:#FFFFFF;
  --sheen:rgba(255,255,255,.75);
  --film-bg:#0C1110;   /* photo band: dark in both themes by design */
  --film-fg:#F3F6F5;
  --film-muted:rgba(243,246,245,.72);
  --f-display:"Bellefair","Frank Ruhl Libre",Georgia,serif;
  --f-body:"IBM Plex Sans Hebrew","Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1514;--surface:#172120;--fg:#E8EEEC;--muted:#97A5A2;--line:#2A3634;--glass:#8CC7BC;--brass:#C9A25E;--on-brass:#1A1305;--sheen:rgba(190,240,230,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1514;--surface:#172120;--fg:#E8EEEC;--muted:#97A5A2;--line:#2A3634;--glass:#8CC7BC;--brass:#C9A25E;--on-brass:#1A1305;--sheen:rgba(190,240,230,.35);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.7 var(--f-body);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glass);outline-offset:3px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);position:relative}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;letter-spacing:.02em}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font:400 clamp(40px,6vw,72px)/1 var(--f-display);letter-spacing:-.005em}
p{margin:0}
.eyebrow{font:500 13px/1.2 var(--f-body);letter-spacing:.12em;color:var(--muted)}

/* motif: dimension line */
.dim{position:relative;display:flex;align-items:center;gap:12px;height:20px;color:var(--glass)}
.dim i{flex:1;height:1px;background:currentColor;position:relative;transform-origin:center;transition:transform 1.1s cubic-bezier(.2,.7,.1,1)}
.dim i::before{content:"";position:absolute;top:-6px;width:1px;height:13px;background:currentColor}
.dim i:first-child::before{right:0}
.dim i:last-child::before{left:0}
.dim b{font:500 12px var(--f-mono);letter-spacing:.06em;white-space:nowrap;color:var(--muted)}
.pre .dim i,.dim.pre i{transform:scaleX(0)}

/* demo ribbon */
.ribbon{background:var(--fg);color:var(--bg);font-size:14px;position:relative;z-index:61}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.ribbon a{color:var(--bg);opacity:.85;white-space:nowrap}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand strong{font:400 26px/1 var(--f-display)}
.brand span{font-size:13px;color:var(--muted)}
.hdr-phone{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:44px;font-size:15px}
.hdr-phone svg{width:18px;height:18px}

/* hero */
.hero{padding-block:48px 32px;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center}
.hero-copy{display:grid;gap:20px;min-width:0;position:relative;z-index:2}
.hero h1{font:400 clamp(60px,10.5vw,140px)/.88 var(--f-display);letter-spacing:-.015em}
.hero h1 small{display:block;font:400 .36em/1.2 var(--f-body);letter-spacing:.02em;color:var(--muted);margin-top:14px}
.hero .tag{font-size:clamp(19px,2.1vw,22px);max-width:30ch;line-height:1.5}
.hero .lede{color:var(--muted);max-width:52ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font:600 17px/1 var(--f-body);text-decoration:none;cursor:pointer;border:0;transition:transform .3s cubic-bezier(.2,.7,.1,1),box-shadow .3s}
.btn svg{width:21px;height:21px;flex:none}
.btn-main{background:var(--brass);color:var(--on-brass);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 30px -12px color-mix(in srgb,var(--brass) 80%,transparent);position:relative;overflow:hidden}
.btn-main::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(120%);transition:transform .9s}
.btn-main:hover{transform:translateY(-2px)}
.btn-main:hover::after{transform:translateX(-120%)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.rating{display:inline-flex;align-items:center;gap:14px;text-decoration:none;width:fit-content;padding:8px 0}
.rating .score{font:400 46px/1 var(--f-display)}
.rating .stars{color:var(--brass);letter-spacing:2px;font-size:15px}
.rating small{display:block;color:var(--muted);font-size:14px}

/* elevation drawing -> real photo */
.sheet-col{display:grid;gap:14px;min-width:0}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;aspect-ratio:1/1;max-width:100%;perspective:1100px;box-shadow:0 30px 60px -40px rgba(10,30,28,.45);overflow:hidden}
.sheet::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.35;pointer-events:none}
.sheet-inner{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.7,.1,1);transform-style:preserve-3d}
.sheet svg{position:absolute;inset:0;width:100%;height:100%}
.sheet .k{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.sheet .s{fill:none;stroke:var(--muted);stroke-width:1;opacity:.55}
.sheet .f{fill:var(--front,transparent);stroke:none;transition:fill .5s}
.sheet .g{fill:var(--gfill,color-mix(in srgb,var(--glass) 14%,transparent));stroke:var(--prof,var(--glass));stroke-width:2.2;transition:fill .5s,stroke .5s}
.sheet .d{fill:none;stroke:var(--glass);stroke-width:1}
.sheet .t{font:500 11px var(--f-mono);fill:var(--muted)}
.sheet .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.3,.6,.1,1) forwards}
.sheet .sh{fill:url(#sheenGrad);animation:sheen 7s cubic-bezier(.45,0,.2,1) 1.8s infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sheen{0%{transform:translateX(-260px) skewX(-18deg)}55%,100%{transform:translateX(520px) skewX(-18deg)}}
.stage{position:relative;padding-bottom:22%}
.pin{position:absolute;left:-5%;bottom:0;width:54%;margin:0;z-index:4;background:var(--surface);padding:6px 6px 0;border:1px solid var(--line);box-shadow:0 26px 50px -24px rgba(10,30,28,.55);transform:rotate(-2.5deg);animation:pinIn 1.1s cubic-bezier(.2,.7,.1,1) 2.2s both}
.pin img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pin figcaption{font:500 11px/1.4 var(--f-mono);color:var(--muted);padding:7px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.pin figcaption b{color:var(--fg);font-weight:500}
@keyframes pinIn{from{transform:translate(-14px,18px) rotate(-6deg)}to{transform:rotate(-2.5deg)}}
.real{position:absolute;inset:0;clip-path:inset(0 0 0 100%);animation:reveal 12s cubic-bezier(.65,0,.35,1) 2.6s infinite}
.real img{width:100%;height:100%;object-fit:cover;display:block;animation:drift 12s ease-in-out 2.6s infinite}
.wipe{position:absolute;top:0;bottom:0;right:0;width:2px;background:var(--glass);box-shadow:0 0 22px 2px var(--glass);opacity:0;animation:wipe 12s cubic-bezier(.65,0,.35,1) 2.6s infinite;pointer-events:none}
@keyframes reveal{0%,6%{clip-path:inset(0 0 0 100%)}20%,76%{clip-path:inset(0 0 0 0)}90%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes wipe{0%,5%{right:0;opacity:0}6%{right:0;opacity:1}20%{right:100%;opacity:1}21%,75%{right:0;opacity:0}76%{right:0;opacity:1}90%{right:100%;opacity:1}91%,100%{opacity:0}}
@keyframes drift{0%,20%{transform:scale(1.02)}76%,100%{transform:scale(1.12)}}
@keyframes lblB{0%,13%{opacity:0}14%,82%{opacity:1}83%,100%{opacity:0}}
@keyframes lblA{0%,13%{opacity:1}14%,82%{opacity:0}83%,100%{opacity:1}}
.titleblock{position:absolute;inset:auto 0 0 auto;z-index:3;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:auto auto;font:500 11px/1.4 var(--f-mono);color:var(--muted);direction:rtl}
.titleblock span{padding:6px 10px;border-left:1px solid var(--line)}
.titleblock span:last-child{border-left:0;color:var(--fg)}
.titleblock .lbl{position:relative;display:grid}
.titleblock .lbl em{font-style:normal;grid-area:1/1}
.has-real .titleblock .la{animation:lblA 12s linear 2.6s infinite}
.has-real .titleblock .lb{opacity:0;animation:lblB 12s linear 2.6s infinite;color:var(--fg)}
.sheet.cfg .real,.sheet.cfg .wipe{animation:none;clip-path:inset(0 0 0 100%);opacity:0}
.sheet.cfg .titleblock .la{animation:none;opacity:1}
.sheet.cfg .titleblock .lb{animation:none;opacity:0}

/* configurator */
.cfgui{display:grid;gap:10px}
.cfg-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cfg-row>span{font-size:14px;color:var(--muted);min-width:64px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .25s}
.sw button i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.sw button:hover{transform:translateY(-2px)}
.cfg-now{font-size:14px;color:var(--fg);min-height:1.7em}

/* title-block band */
.band{border-block:1px solid var(--line);background:var(--surface)}
.band .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:20px 18px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font:400 42px/1 var(--f-display)}
.stat span{color:var(--muted);font-size:14px}

/* film: full-bleed slideshow of the client's own work */
.film{position:relative;height:clamp(440px,74vh,740px);background:var(--film-bg);color:var(--film-fg);overflow:hidden;isolation:isolate}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.3s ease}
.slide.on{opacity:1;z-index:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.slide.on img{animation:kb var(--dur,6s) linear forwards}
.slide:nth-child(even).on img{animation-name:kb2}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.15) translate(-2.5%,-1.5%)}}
@keyframes kb2{from{transform:scale(1.15) translate(2%,1%)}to{transform:scale(1.04) translate(0,0)}}
.film::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(5,8,8,.82) 0%,rgba(5,8,8,.35) 38%,transparent 62%),linear-gradient(to bottom,rgba(5,8,8,.45),transparent 22%)}
.film-ui{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding-block:22px 28px;pointer-events:none}
.film-ui>*{pointer-events:auto;width:100%}
.bars{display:flex;gap:6px}
.bars span{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden}
.bars span i{display:block;height:100%;width:100%;background:var(--film-fg);transform:scaleX(0);transform-origin:right}
.bars span.done i{transform:scaleX(1)}
.bars span.on i{animation:fill var(--dur,6s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.film.paused .bars span.on i,.film.paused .slide.on img{animation-play-state:paused}
.film-bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.film .dim{color:var(--film-fg);max-width:420px}
.film .dim b{color:var(--film-muted)}
.film-cap{font:400 clamp(30px,4.4vw,56px)/1.05 var(--f-display);margin-top:12px;min-height:2.1em;text-wrap:balance;max-width:20ch}
.film-meta{display:flex;gap:16px;align-items:center;margin-top:10px;color:var(--film-muted);font-size:14px}
.film-nav{display:flex;gap:8px;align-items:center}
.film-nav button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--film-fg);cursor:pointer;display:grid;place-items:center}
.film-nav button:hover{background:rgba(255,255,255,.18)}
.film-nav svg{width:20px;height:20px}
.thumbs{display:flex;gap:8px;margin-top:16px}
.thumbs button{width:72px;height:52px;padding:0;border:1px solid rgba(255,255,255,.3);border-radius:4px;overflow:hidden;cursor:pointer;opacity:.55;transition:opacity .3s,transform .3s;background:none}
.thumbs button[aria-current="true"]{opacity:1;border-color:var(--film-fg);transform:translateY(-3px)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

section{padding-block:84px}
.sec-head{display:grid;gap:14px;margin-bottom:40px}
.sec-head p{color:var(--muted);max-width:60ch}

/* services schedule */
.sched{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:28px;align-items:baseline;padding:24px 2px;border-bottom:1px solid var(--line);position:relative}
.row h3{font:400 clamp(28px,3.2vw,40px)/1.05 var(--f-display)}
.row p{color:var(--muted)}
.row::after{content:"";position:absolute;bottom:-1px;inset-inline:0;height:1px;background:var(--glass);transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.row:hover::after{transform:scaleX(1)}

/* reviews */
.quotes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.q{padding:28px 0 28px 28px;display:grid;gap:14px;align-content:start;min-width:0}
.q:first-child{grid-row:span 2;border-left:1px solid var(--line);padding-left:40px}
.q:not(:first-child){padding-right:32px;padding-left:0}
.q:nth-child(3){border-top:1px solid var(--line)}
.q blockquote{margin:0;font:400 22px/1.5 var(--f-body)}
.q:first-child blockquote{font:400 clamp(28px,3.3vw,40px)/1.25 var(--f-display)}
.q blockquote::before{content:"״";display:block;font:400 72px/.6 var(--f-display);color:var(--glass);height:30px}
.q footer{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;padding:0}
.q footer .stars{color:var(--brass);letter-spacing:2px}
.allrev{display:inline-flex;margin-top:22px;color:var(--muted);font-size:15px;min-height:44px;align-items:center}

/* process */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.step{display:grid;gap:10px;align-content:start;min-width:0;padding-top:18px;border-top:1px solid var(--fg)}
.step .n{font:500 13px var(--f-mono);color:var(--glass)}
.step h3{font:400 28px/1.1 var(--f-display)}
.step p{color:var(--muted);font-size:16px}

/* placeholder gallery (only when there are no photos yet) */
.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-auto-rows:210px;gap:14px}
.gallery figure{margin:0;position:relative;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.gallery figure:first-child{grid-row:span 2}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;color:var(--muted);font-size:15px}
.ph::before,.ph::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--glass)}
.ph::before{top:12px;right:12px;border-left:0;border-bottom:0}
.ph::after{bottom:12px;left:12px;border-right:0;border-top:0}
.ph .mono{display:block;font-size:11px;color:var(--glass);margin-bottom:4px}

/* area + hours */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.area{display:flex;flex-wrap:wrap;gap:10px}
.area span{padding:9px 18px;border:1px solid var(--line);border-radius:999px;font-size:16px;background:var(--surface)}
.area span.home{border-color:var(--glass);box-shadow:inset 0 0 0 1px var(--glass)}
.hours{border-top:1px solid var(--line)}
.hours div{display:flex;justify-content:space-between;gap:16px;padding:13px 2px;border-bottom:1px solid var(--line)}
.hours div span:last-child{color:var(--muted)}
.addr{margin-top:18px;color:var(--muted);font-size:15px}

/* final */
.final{text-align:center;background:var(--surface);border-block:1px solid var(--line)}
.final h2{font-size:clamp(50px,8.5vw,108px);max-width:14ch;margin-inline:auto}
.final .ctas{justify-content:center;margin-top:28px}
.final .phone-big{display:block;margin-top:16px;font:500 20px var(--f-mono);color:var(--muted);direction:ltr}

/* owner offer (demo only): inverted sheet */
.offer{background:var(--fg);color:var(--bg)}
.offer .eyebrow,.offer .muted{color:color-mix(in srgb,var(--bg) 72%,var(--fg))}
.offer .dim b{color:color-mix(in srgb,var(--bg) 72%,var(--fg))}
.offer-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px}
.price{display:flex;align-items:flex-end;gap:12px;margin:22px 0 6px}
.price b{font:400 clamp(90px,12vw,150px)/.8 var(--f-display)}
.price span{padding-bottom:12px}
.inc{list-style:none;margin:0;padding:0;border-top:1px solid color-mix(in srgb,var(--bg) 25%,var(--fg))}
.inc li{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid color-mix(in srgb,var(--bg) 25%,var(--fg));font-size:16px}
.inc li::before{content:"";flex:none;width:14px;height:1px;margin-top:13px;background:var(--glass)}
.inc li.bonus b{font-weight:600;color:var(--glass)}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:32px}
.terms div{border:1px solid color-mix(in srgb,var(--bg) 25%,var(--fg));border-radius:4px;padding:18px}
.terms b{display:block;font:400 26px/1.1 var(--f-display);margin-bottom:6px}
.terms p{font-size:15px}
.switch{margin-top:22px;font-size:16px;max-width:62ch}

footer.site{padding-block:26px 110px;color:var(--muted);font-size:14px}
footer.site .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

}

          <div class="film-meta"><span class="mono" id="film-count">01 / ${String(photos.length).padStart(2,"0")}</span><span>${esc(S.filmNote || "צילומים מתוך פרופיל העסק בגוגל")}</span></div>
          <div class="thumbs">${photos.map((p,i)=>`<button type="button" id="th-${i}" data-i="${i}" aria-label="תמונה ${i+1}" aria-current="${i===0}"><img src="${esc(p.src)}" alt="" loading="lazy"></button>`).join("")}</div>
        </div>
        <div class="film-nav"><button type="button" id="film-prev" aria-label="התמונה הקודמת">${arrow("M9 6l6 6-6 6")}</button><button type="button" id="film-next" aria-label="התמונה הבאה">${arrow("M15 6l-6 6 6 6")}</button></div>
      </div>
    </div>
  </section>` : "";

  document.getElementById("app").innerHTML = `
  ${S.demo ? `<div class="ribbon"><div class="wrap"><span>אתר לדוגמה שהוכן עבור ${esc(S.business)}${photos.length?" מהתמונות והביקורות בגוגל":""}. עדיין לא פורסם.</span><a href="#offer">ההצעה ל${esc(offerTo)} ←</a></div></div>`:""}
  <header><div class="wrap">
    <div class="brand"><strong>${esc(S.business)}</strong><span>${esc(S.trade)} · ${esc(S.city)}</span></div>
    <a class="hdr-phone" href="tel:${esc(S.phone)}">${phoneIcon}<span class="lbl">טלפון:</span><span class="mono">${esc(S.phone)}</span></a>
  </div></header>

  <main>
  <div class="hero"><div class="wrap">
    <div class="hero-copy">
      <span class="eyebrow">${esc(S.trade)} · ${esc(S.city)} והסביבה</span>
      <h1>${esc(S.heroName || S.business)}<small>${esc(S.heroTrade || S.trade)}</small></h1>
      <p class="tag">${esc(S.tagline)}</p>
      <p class="lede">${esc(S.intro)}</p>
      <div class="ctas">
        <a class="btn btn-main" href="${wa}" target="_blank" rel="noopener">${waIcon}${esc(S.ctaLabel || "שלחו הודעה בוואטסאפ")}</a>
        <a class="btn btn-ghost" href="tel:${esc(S.phone)}">${phoneIcon}<span class="mono">${esc(S.phone)}</span></a>
      </div>
      ${S.rating ? `<a class="rating" href="${esc(S.googleUrl)}" target="_blank" rel="noopener"><span class="score mono">${S.rating.toFixed(1)}</span><span><span class="stars" aria-label="${S.rating} כוכבים">${stars(S.rating)}</span><small>${S.reviews} ביקורות בגוגל</small></span></a>`:""}
    </div>
    <div class="sheet-col">
      <div class="${heroPhoto?"stage":""}">
      <div class="sheet" id="sheet"><div class="sheet-inner" id="sheet-inner">${sheetSvg}
        <div class="titleblock" aria-hidden="true"><span class="lbl"><em class="la">${esc(S.sheetLabel || "חזית")}</em></span><span class="mono">1:20</span></div>
      </div></div>
      ${heroPhoto ? `<figure class="pin"><img src="${esc(heroPhoto.src)}" alt="${esc(heroPhoto.alt||heroPhoto.cap||"")}"><figcaption><b>${esc(S.realLabel || "בפועל, אצל לקוח")}</b><span>${esc(S.city||"")}</span></figcaption></figure>`:""}
      </div>
      ${cfgUI}
    </div>
  </div></div>

  <div class="band"><div class="wrap">
    ${(S.stats||[]).map(s=>`<div class="stat"><b class="mono">${esc(s.v)}</b><span>${esc(s.l)}</span></div>`).join("")}
  </div></div>

  ${film}

  <section id="services"><div class="wrap">
    <div class="sec-head rv">${dim(S.servicesEyebrow || "מה עושים")}<h2>${esc(S.servicesTitle || "השירותים")}</h2><p>${esc(S.servicesIntro || "")}</p></div>
    <div class="sched">${services}</div>
  </div></section>

  ${quotes ? `<section id="reviews" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv">${dim(`${S.rating ? S.rating.toFixed(1) : ""} · ${S.reviews || ""} ביקורות בגוגל`)}<h2>${esc(S.reviewsTitle || "מה כתבו הלקוחות")}</h2></div>
    <div class="quotes">${quotes}</div>
    ${S.googleUrl?`<a class="allrev" href="${esc(S.googleUrl)}" target="_blank" rel="noopener">לכל הביקורות בגוגל ←</a>`:""}
  </div></section>` : ""}

  <section id="process" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv">${dim("איך זה עובד")}<h2>${esc(S.processTitle || "ממידה ועד התקנה")}</h2></div>
    <div class="steps">${steps}</div>
  </div></section>

  ${photos.length < 2 ? `<section id="gallery" style="padding-top:0"><div class="wrap">
    <div class="sec-head rv">${dim("עבודות")}<h2>${esc(S.galleryTitle || "מהבתים של הלקוחות")}</h2>${S.demo?`<p>${esc(S.galleryNote||"כאן ייכנסו תמונות של העבודות שלך. שולחים 5 תמונות מהטלפון ואני מכניסה אותן.")}</p>`:""}</div>
    <div class="gallery">${placeholders}</div>
  </div></section>` : ""}

  <section id="area" style="padding-top:0"><div class="wrap two">
    <div class="rv">${dim("אזור שירות")}<h2 style="margin:14px 0 28px">${esc(S.areaTitle || "איפה עובדים")}</h2><div class="area">${area}</div></div>
    <div class="rv">${dim("זמינות")}<h2 style="margin:14px 0 28px">שעות</h2><div class="hours">${hours}</div>${S.address?`<p class="addr">${esc(S.address)}</p>`:""}</div>
  </div></section>

  <section class="final"><div class="wrap rv">
    <span class="eyebrow">${esc(S.trade)} · ${esc(S.city)}</span>
    <h2 style="margin-top:14px">${esc(S.finalTitle || "בואו נמדוד")}</h2>
    <div class="ctas"><a class="btn btn-main" href="${wa}" target="_blank" rel="noopener">${waIcon}${esc(S.ctaLabel || "שלחו הודעה בוואטסאפ")}</a></div>
    <span class="phone-big">${esc(S.phone)}</span>
  </div></section>

  ${S.demo ? `
  <section class="offer" id="offer"><div class="wrap">
    <div class="sec-head rv">${dim("ההצעה ל" + offerTo + " · לא חלק מהאתר")}<h2>${esc(O.title)}</h2></div>
    <div class="offer-grid rv">
      <div>
        <p class="muted" style="max-width:52ch">${esc(O.lead)}</p>
        <div class="price"><b class="mono">${esc(O.price)}</b><span>₪ לשנה הראשונה, הכל כלול</span></div>
        <p class="muted" style="font-size:15px">${esc(O.renewal)}</p>
        ${O.sellerPhoneIntl ? `<div class="ctas" style="margin-top:26px"><a class="btn btn-main" href="https://wa.me/${esc(O.sellerPhoneIntl)}?text=${encodeURIComponent(O.sellerWaText || ("היי, ראיתי את האתר לדוגמה של "+S.business+". רוצה שיעלה לאוויר"))}" target="_blank" rel="noopener">${waIcon}${esc(O.cta || "אני רוצה את האתר")}</a></div>`:""}
      </div>
      <ul class="inc">${inc}</ul>
    </div>
    <div class="terms">${terms}</div>
    ${O.switchNote ? `<p class="switch muted rv">${esc(O.switchNote)}</p>`:""}
  </div></section>`:""}
  </main>

  <footer class="site"><div class="wrap"><span>© ${year} ${esc(S.business)}</span><span>${esc(S.city)} · <span class="mono">${esc(S.phone)}</span></span></div></footer>
  <div class="bar"><a class="btn btn-main" href="${wa}" target="_blank" rel="noopener">${waIcon}וואטסאפ</a><a class="btn btn-ghost" href="tel:${esc(S.phone)}">${phoneIcon}חיוג</a></div>`;

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && "IntersectionObserver" in window){
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("pre"); io.unobserve(e.target);} }),{rootMargin:"0px 0px -8% 0px"});
    document.querySelectorAll(".rv").forEach(el=>{ if(el.getBoundingClientRect().top > innerHeight){ el.classList.add("pre"); io.observe(el);} });
  }

  // hero tilt
  const sh = document.getElementById("sheet"), si = document.getElementById("sheet-inner");
  if (!reduce && matchMedia("(pointer:fine)").matches && sh){
    sh.addEventListener("pointermove", e=>{ const r=sh.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; si.style.transform=`rotateY(${x*8}deg) rotateX(${-y*8}deg)`; });
    sh.addEventListener("pointerleave", ()=>{ si.style.transform=""; });
  }

  // configurator
  if (CFG){
    const now = document.getElementById("cfg-now"), picked = {};
    document.querySelectorAll(".sw button").forEach(b=>b.addEventListener("click", ()=>{
      const r = +b.dataset.r, o = +b.dataset.o, row = CFG[r];
      sh.classList.add("cfg");
      sh.style.setProperty(row.v, row.o[o][1]);
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
      picked[r] = row.o[o][0];
      now.textContent = CFG.map((rw,i)=>picked[i] ? `${rw.label}: ${picked[i]}` : "").filter(Boolean).join(" · ");
    }));
  }

  // film
  const F = document.getElementById("film");
  if (F){
    const slides=[...F.querySelectorAll(".slide")], bars=[...F.querySelectorAll(".bars span")], thumbs=[...F.querySelectorAll(".thumbs button")];
    const cap=document.getElementById("film-cap"), cnt=document.getElementById("film-count"), n=slides.length;
    let i=0;
    const go = k => {
      i = (k+n)%n;
      slides.forEach((s,j)=>{ s.classList.toggle("on", j===i); s.setAttribute("aria-hidden", j===i ? "false":"true"); });
      bars.forEach((b,j)=>{ b.classList.remove("on"); b.classList.toggle("done", j<i); });
      void F.offsetWidth;
      bars[i].classList.add("on");
      const img = slides[i].querySelector("img"); img.style.animation="none"; void img.offsetWidth; img.style.animation="";
      thumbs.forEach((t,j)=>t.setAttribute("aria-current", j===i ? "true":"false"));
      cap.textContent = photos[i].cap || "";
      cnt.textContent = `${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;
    };
    bars.forEach(b=>b.querySelector("i").addEventListener("animationend", ()=>{ if(b.classList.contains("on") && !reduce) go(i+1); }));
    document.getElementById("film-next").addEventListener("click", ()=>go(i+1));
    document.getElementById("film-prev").addEventListener("click", ()=>go(i-1));
    thumbs.forEach(t=>t.addEventListener("click", ()=>go(+t.dataset.i)));
    F.addEventListener("pointerenter", e=>{ if(e.pointerType==="mouse") F.classList.add("paused"); });
    F.addEventListener("pointerleave", ()=>F.classList.remove("paused"));
    F.addEventListener("focusin", ()=>F.classList.add("paused"));
    F.addEventListener("focusout", ()=>F.classList.remove("paused"));
    let sx=null;
    F.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; }, {passive:true});
    F.addEventListener("touchend", e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) go(i + (dx>0?1:-1)); sx=null; });
    document.addEventListener("visibilitychange", ()=>F.classList.toggle("paused", document.hidden));
  }
})();
</script>

</body>
</html>
