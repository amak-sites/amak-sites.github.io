<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="שיפוצים ובנייה לבתים ולעסקים בקרית טבעון והסביבה. שחף ויוסי מלווים את העבודה מההתחלה ועד הגימור האחרון.">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>או טי איי בנייה ויזמות | שיפוצים ובנייה בקרית טבעון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* One template, three skins, so two contractors in the same city never get the same site.
   paint    - dark plaster studio. Motif: a paint roller stroke; hero is a wall elevation the visitor repaints.
   schedule - drafting paper. Motif: a project schedule bar; hero is a Gantt that runs to the agreed finish date.
   shade    - lime-washed stone. Motif: slat shadows; hero is a pergola whose shadow follows the sun.
   Each skin is a deliberate single look (set by the business, not the viewer), so colours are fixed per skin. */
:root{
  --bg:#151412; --surface:#1D1B18; --raise:#25221E; --fg:#EFE9DF; --muted:#A99F92; --line:#36312B;
  --cta:#E3AB3C; --on-cta:#1A1306; --motif:#E3AB3C; --wall:#EDE6DA; --wall-ink:#1E1C19;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:14px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
:root[data-skin="schedule"]{
  --bg:#F1F1EC; --surface:#FBFBF8; --raise:#E7E7E0; --fg:#111314; --muted:#565B5F; --line:#D4D4CB;
  --cta:#F2C200; --on-cta:#111314; --motif:#111314;
  --f-display:"Heebo",system-ui,sans-serif; --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:4px; color-scheme:light;
}
:root[data-skin="shade"]{
  --bg:#E4E9E0; --surface:#EEF1EA; --raise:#D8DFD3; --fg:#17231B; --muted:#4E5D52; --line:#C3CDBF;
  --cta:#24513A; --on-cta:#FFFFFF; --motif:#17231B; --slat:#8B5E36; --sky1:#CFE0E6; --sky2:#EEF1EA;
  --f-display:"Suez One","Frank Ruhl Libre",Georgia,serif; --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:22px; color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.7 var(--f-body);direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--motif);outline-offset:3px;border-radius:4px}
:root[data-skin="paint"] :focus-visible{outline-color:var(--cta)}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);position:relative}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;letter-spacing:.02em}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
h2{font:400 clamp(40px,6vw,74px)/1 var(--f-display)}
:root[data-skin="schedule"] h2{font-weight:900;letter-spacing:-.035em;line-height:.95}
.eyebrow{font:500 13px/1.2 var(--f-body);letter-spacing:.12em;color:var(--muted)}

/* ---------- motif marks (one per skin) ---------- */
.mark{display:flex;align-items:center;gap:14px;min-height:22px;color:var(--muted);font:500 13px/1.2 var(--f-body);letter-spacing:.1em}
.mark b{font-weight:500;white-space:nowrap}
/* paint: a roller stroke */
.mark .stroke{width:120px;height:18px;flex:none}
.mark .stroke path{fill:none;stroke:var(--motif);stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.6,.1,1)}
.pre .mark .stroke path{stroke-dashoffset:1}
/* schedule: progress ticks */
.mark .ticks{display:grid;grid-template-columns:repeat(var(--n,6),18px);gap:3px;flex:none}
.mark .ticks i{height:10px;background:var(--line)}
.mark .ticks i.on{background:var(--motif);transition:transform .5s cubic-bezier(.2,.7,.1,1);transform-origin:right}
.pre .mark .ticks i.on{transform:scaleX(0)}
/* shade: drifting slat shadow band */
.mark .slats{flex:1;max-width:200px;height:14px;border-radius:7px;background:repeating-linear-gradient(100deg,color-mix(in srgb,var(--motif) 70%,transparent) 0 6px,transparent 6px 15px);animation:drift 9s linear infinite;opacity:.55}
@keyframes drift{to{background-position:-150px 0}}

/* ---------- ribbon + header ---------- */
.ribbon{background:var(--fg);color:var(--bg);font-size:14px;position:relative;z-index:61}
.ribbon .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.ribbon a{color:var(--bg);opacity:.85;white-space:nowrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand strong{font:400 24px/1 var(--f-display)}
:root[data-skin="schedule"] .brand strong{font-weight:900;letter-spacing:-.02em}
.brand span{font-size:13px;color:var(--muted)}
.hdr-phone{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:44px;font-size:15px;white-space:nowrap;flex:none}
.hdr-phone svg{width:18px;height:18px}

/* ---------- buttons ---------- */
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;font:600 17px/1 var(--f-body);text-decoration:none;cursor:pointer;border:0;transition:transform .3s cubic-bezier(.2,.7,.1,1),box-shadow .3s}
:root[data-skin="schedule"] .btn{border-radius:var(--radius);font-weight:700}
.btn svg{width:21px;height:21px;flex:none}
.btn-main{background:var(--cta);color:var(--on-cta);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 34px -14px color-mix(in srgb,var(--cta) 85%,transparent)}
:root[data-skin="schedule"] .btn-main{box-shadow:4px 4px 0 var(--fg)}
.btn-main:hover{transform:translateY(-2px)}
:root[data-skin="schedule"] .btn-main:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--fg)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--muted)}
.rating{display:inline-flex;align-items:center;gap:14px;text-decoration:none;width:fit-content;padding:6px 0}
.rating .score{font:400 46px/1 var(--f-display)}
:root[data-skin="schedule"] .rating .score{font-weight:900}
.rating .stars{color:var(--cta);letter-spacing:2px;font-size:15px}
:root[data-skin="schedule"] .rating .stars{color:var(--fg)}
.rating small{display:block;color:var(--muted);font-size:14px}

/* ---------- hero (shared) ---------- */
.hero{padding-block:44px 36px;position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.hero-copy{display:grid;gap:20px;min-width:0;align-content:start}
.hero h1{font:400 clamp(58px,9.5vw,128px)/.9 var(--f-display);letter-spacing:-.01em}
.hero h1 small{display:block;font:500 .3em/1.25 var(--f-body);letter-spacing:.02em;color:var(--muted);margin-top:14px}
.hero .tag{font-size:clamp(19px,2.1vw,23px);max-width:28ch;line-height:1.45}
.hero .lede{color:var(--muted);max-width:52ch}

/* paint hero: wall elevation + roller */
.wall-col{display:grid;gap:14px;min-width:0}
.wallbox{position:relative}
.wall{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--raise);border:1px solid var(--line);aspect-ratio:5/4;max-width:100%;box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}
.wall svg{position:absolute;inset:0;width:100%;height:100%}
.wall .ln{fill:none;stroke:var(--wall-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.wall .lt{fill:none;stroke:var(--wall-ink);stroke-width:1;opacity:.45;transition:stroke .4s}
.wall .tx{font:500 10.5px var(--f-mono);fill:var(--wall-ink);opacity:.7;transition:fill .4s}
.wall .roller rect{fill:#2B2824}
.wall .roller .nap{fill:var(--paint-new,var(--wall))}
.wall .roller path{fill:none;stroke:#2B2824;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.snap{position:absolute;left:-6%;bottom:-11%;width:44%;margin:0;background:var(--fg);padding:6px 6px 0;box-shadow:0 26px 50px -20px rgba(0,0,0,.7);transform:rotate(-3deg);z-index:3}
.snap img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.snap figcaption{font:500 11px/1.3 var(--f-mono);color:var(--bg);padding:7px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.paints{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.paints>span{font-size:14px;color:var(--muted)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .25s}
.sw button i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.sw button:hover{transform:translateY(-2px)}
.paint-now{font-size:14px;min-height:1.6em}

/* schedule hero: big statement + gantt */
.hero-sched .hero-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);align-items:end}
.hero-sched h1{font-weight:900;letter-spacing:-.05em;line-height:.86;font-size:clamp(56px,10vw,138px)}
.hero-sched h1 small{font-weight:500;letter-spacing:0}
.hero-sched .side{display:grid;gap:18px;min-width:0;padding-bottom:10px}
.gantt{margin-top:34px;background:var(--surface);border:1px solid var(--fg);border-radius:var(--radius);overflow-x:auto}
.gantt-in{min-width:640px;position:relative}
.g-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--fg);font-size:14px}
.g-head b{font-weight:700}
.g-head span{color:var(--muted)}
.g-row{display:grid;grid-template-columns:190px minmax(0,1fr) 110px;align-items:center;border-bottom:1px solid var(--line);min-height:46px}
.g-row:last-child{border-bottom:0}
.g-row .lbl{padding:0 16px;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row .end{padding:0 12px;font:500 12px var(--f-mono);color:var(--muted);text-align:center;border-inline-start:1px solid var(--line);height:100%;display:grid;place-items:center}
.g-weeks .lbl,.g-weeks .end{font:500 11px var(--f-mono);color:var(--muted)}
.track{position:relative;height:100%;min-height:46px;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--w,8)) 100%}
.g-weeks .track{display:grid;grid-template-columns:repeat(var(--w,8),1fr);align-items:center;background:none}
.g-weeks .track span{font:500 11px var(--f-mono);color:var(--muted);text-align:center}
.gbar{position:absolute;top:13px;bottom:13px;border:1.5px solid var(--fg);background:repeating-linear-gradient(-45deg,transparent 0 5px,color-mix(in srgb,var(--fg) 14%,transparent) 5px 6px)}
.gbar i{position:absolute;inset:0 0 0 auto;width:calc(var(--p,0) * 100%);background:var(--fg)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--cta);box-shadow:0 0 0 1px var(--fg);pointer-events:none;z-index:2}
.today::before{content:"היום";position:absolute;top:2px;transform:translateX(50%);right:0;background:var(--cta);color:var(--on-cta);font:700 11px/1 var(--f-body);padding:3px 6px;border:1px solid var(--fg);white-space:nowrap}
.flag{position:absolute;top:0;bottom:0;border-inline-start:2px dashed var(--fg)}
.stamp{position:absolute;inset-inline-end:14px;bottom:12px;z-index:3;border:2px solid var(--fg);padding:6px 12px;font:900 15px/1.1 var(--f-display);background:var(--cta);color:var(--on-cta);transform:rotate(-4deg) scale(.6);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.stamp.on{transform:rotate(-4deg) scale(1);opacity:1}
.stamp small{display:block;font:500 11px var(--f-mono)}
.g-note{font-size:13px;color:var(--muted);margin-top:10px}
.g-row .end.done{color:var(--fg)}

/* shade hero: pergola + sun */
.hero-shade{padding-top:30px}
.hero-shade .hero-grid{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}
.hero-shade h1{line-height:.95}
.scene{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);aspect-ratio:4/3.2;max-width:100%;box-shadow:0 40px 70px -46px rgba(20,40,25,.55)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .post{fill:var(--slat-c,var(--slat));transition:fill .5s}
.scene .slat{stroke:var(--slat-c,var(--slat));stroke-width:3.2;stroke-linecap:round;transition:stroke .5s}
.scene .beam{fill:var(--slat-c,var(--slat));transition:fill .5s}
.scene .edge{fill:none;stroke:color-mix(in srgb,var(--fg) 55%,transparent);stroke-width:1}
.scene .floor{fill:#D9D2C2}
.scene .shadow{stroke:#2A2A22;stroke-opacity:.34;stroke-width:8;stroke-linecap:butt}
.scene .sun{fill:#F3C24E}
.scene .sunglow{fill:#F3C24E;opacity:.25}
.scene .table{fill:#F5F1E8;stroke:color-mix(in srgb,var(--fg) 55%,transparent);stroke-width:1}
.shade-ui{display:grid;gap:12px;margin-top:14px}
.time-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.time-row label{font-size:14px;color:var(--muted)}
.time-row input[type=range]{flex:1;min-width:180px;accent-color:var(--cta);height:44px}
.time-row output{font:500 18px var(--f-mono);min-width:5ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips>span{font-size:14px;color:var(--muted);margin-inline-end:4px}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.chips button i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chips button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.scene-cap{position:absolute;inset-inline-start:14px;top:12px;font:500 12px var(--f-mono);color:var(--fg);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:5px 9px;border-radius:999px;direction:rtl}

/* ---------- stats band ---------- */
.band{border-block:1px solid var(--line);background:var(--surface)}
:root[data-skin="schedule"] .band{border-color:var(--fg)}
.band .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:20px 18px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font:400 40px/1 var(--f-display)}
:root[data-skin="schedule"] .stat b{font-weight:900;letter-spacing:-.03em}
.stat span{color:var(--muted);font-size:14px}

/* ---------- film ---------- */
.film{position:relative;height:clamp(420px,70vh,700px);background:#0B0B0A;color:#F4F2EE;overflow:hidden;isolation:isolate}
:root[data-skin="shade"] .film{margin-inline:var(--gut);border-radius:var(--radius);margin-block:28px 0}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1;z-index:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.slide.on img{animation:kb 7s linear forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-2%,-1%)}}
.film::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.2) 45%,transparent 65%)}
.film-ui{position:absolute;inset:auto 0 0;z-index:3;padding-block:0 28px}
.film-ui .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.film .mark{color:rgba(244,242,238,.75)}
:root[data-skin="schedule"] .film .mark .ticks i{background:rgba(255,255,255,.25)}
.film-cap{font:400 clamp(28px,4vw,52px)/1.08 var(--f-display);margin-top:10px;min-height:2.2em;max-width:22ch;text-wrap:balance}
.film-meta{display:flex;gap:14px;margin-top:8px;color:rgba(244,242,238,.72);font-size:14px;flex-wrap:wrap}
.film-nav{display:flex;gap:8px}
.film-nav button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F4F2EE;cursor:pointer;display:grid;place-items:center}
.film-nav svg{width:20px;height:20px}

section{padding-block:84px}
.sec-head{display:grid;gap:14px;margin-bottom:40px;max-width:780px}
.sec-head p{color:var(--muted);max-width:60ch}

/* ---------- services ---------- */
.svc{display:grid;gap:0}
.svc .it{min-width:0;position:relative}
.svc h3{font:400 clamp(26px,3vw,36px)/1.1 var(--f-display)}
.svc p{color:var(--muted)}
/* paint: two columns, chip of paint per row */
:root[data-skin="paint"] .svc{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px;border-top:1px solid var(--line)}
:root[data-skin="paint"] .svc .it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;padding:26px 0;border-bottom:1px solid var(--line)}
:root[data-skin="paint"] .svc .chip{grid-row:span 2;width:34px;height:34px;border-radius:50%;margin-top:4px;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
:root[data-skin="paint"] .svc .it::after{content:"";position:absolute;bottom:-1px;inset-inline:0;height:3px;background:var(--motif);transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
:root[data-skin="paint"] .svc .it:hover::after{transform:scaleX(1)}
/* schedule: spec table */
:root[data-skin="schedule"] .svc{border-top:2px solid var(--fg)}
:root[data-skin="schedule"] .svc .it{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line)}
:root[data-skin="schedule"] .svc .code{font:500 13px var(--f-mono);color:var(--muted)}
:root[data-skin="schedule"] .svc h3{font-weight:800;letter-spacing:-.02em}
:root[data-skin="schedule"] .svc .chip{display:none}
:root[data-skin="paint"] .svc .code,:root[data-skin="shade"] .svc .code{display:none}
/* shade: cards under slat shadow */
:root[data-skin="shade"] .svc{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
:root[data-skin="shade"] .svc .it{background:var(--surface);border-radius:var(--radius);padding:26px 24px 28px;display:grid;gap:10px;overflow:hidden;border:1px solid var(--line)}
:root[data-skin="shade"] .svc .it::before{content:"";position:absolute;inset:-20% -30% auto auto;width:80%;height:70%;background:repeating-linear-gradient(110deg,color-mix(in srgb,var(--motif) 9%,transparent) 0 10px,transparent 10px 24px);transform:rotate(8deg);pointer-events:none;transition:transform 1.2s cubic-bezier(.2,.7,.1,1)}
:root[data-skin="shade"] .svc .it:hover::before{transform:rotate(8deg) translateX(-30px)}
:root[data-skin="shade"] .svc .chip{display:none}
:root[data-skin="shade"] .svc h3{position:relative}

/* ---------- reviews ---------- */
.quotes{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);border-top:1px solid var(--line)}
.q{margin:0;padding:28px 0 28px 30px;display:grid;gap:14px;align-content:start;min-width:0}
.q:first-child{grid-row:span 2;border-left:1px solid var(--line);padding-left:40px}
.q:not(:first-child){padding-right:32px;padding-left:0}
.q:nth-child(3){border-top:1px solid var(--line)}
.q blockquote{margin:0;font:400 21px/1.55 var(--f-body)}
.q:first-child blockquote{font:400 clamp(26px,3vw,36px)/1.3 var(--f-display)}

.q footer .stars{color:var(--cta);letter-spacing:2px}

.allrev{display:inline-flex;margin-top:22px;color:var(--muted);font-size:15px;min-height:44px;align-items:center}

/* ---------- process ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;counter-reset:s}
.step{display:grid;gap:10px;align-content:start;min-width:0}
.step .n{font:400 64px/1 var(--f-display);color:transparent;-webkit-text-stroke:1.2px var(--muted)}
.step h3{font:400 26px/1.15 var(--f-display)}
.step p{color:var(--muted);font-size:16px}
:root[data-skin="schedule"] .steps{gap:0;border:1px solid var(--fg);background:var(--surface)}
:root[data-skin="schedule"] .step{padding:20px 18px 24px;border-inline-start:1px solid var(--line)}
:root[data-skin="schedule"] .step:first-child{border-inline-start:0}
:root[data-skin="schedule"] .step .n{font:500 12px var(--f-mono);color:var(--muted);-webkit-text-stroke:0;display:flex;gap:8px;align-items:center}
:root[data-skin="schedule"] .step .n::after{content:"";flex:1;height:8px;background:var(--fg);transform-origin:right;transform:scaleX(calc(var(--i) / 4))}
:root[data-skin="schedule"] .step h3{font-weight:800;letter-spacing:-.02em}
:root[data-skin="shade"] .steps{grid-template-columns:1fr;gap:0;max-width:820px;border-inline-start:2px solid var(--line);padding-inline-start:28px}
:root[data-skin="shade"] .step{grid-template-columns:70px minmax(0,1fr);column-gap:20px;padding:18px 0;position:relative}
:root[data-skin="shade"] .step::before{content:"";position:absolute;inset-inline-start:-37px;top:28px;width:16px;height:16px;border-radius:50%;background:var(--cta);box-shadow:0 0 0 5px var(--bg)}
:root[data-skin="shade"] .step .n{grid-row:span 2;font-size:48px}
:root[data-skin="shade"] .step p{grid-column:2}

.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-auto-rows:200px;gap:14px}
.gallery figure{margin:0;position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px dashed var(--muted)}
.gallery figure:first-child{grid-row:span 2}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;color:var(--muted);font-size:15px}
.ph .mono{display:block;font-size:11px;margin-bottom:4px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.two h2{margin:14px 0 28px}
.area{display:flex;flex-wrap:wrap;gap:10px}
.area span{padding:9px 18px;border:1px solid var(--line);border-radius:999px;font-size:16px;background:var(--surface)}

.hours div span:last-child{color:var(--muted)}
.addr{margin-top:18px;color:var(--muted);font-size:15px}

.terms b{display:block;font:400 25px/1.1 var(--f-display);margin-bottom:6px}
.terms p{font-size:15px}
.switch{margin-top:22px;font-size:16px;max-width:62ch}

footer.site{padding-block:26px 110px;color:var(--muted);font-size:14px}

  /* ---------------- behaviour ---------------- */
  if (!reduce && "IntersectionObserver" in window){
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove("pre"); io.unobserve(e.target);} }),{rootMargin:"0px 0px -8% 0px"});
    document.querySelectorAll(".rv").forEach(el=>{ if(el.getBoundingClientRect().top > innerHeight){ el.classList.add("pre"); io.observe(el);} });

  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

    const rect = document.getElementById("rollrect"), roller = document.getElementById("roller");

    const lum = hex => { const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };

  // schedule: "today" line walks the plan; bars fill; stamp lands at the finish date
  if (skin === "schedule"){

    // roof plane: front edge y=110 (x 40..360), back edge y=78 (x 90..310)

    slats.innerHTML = s;

      sun.setAttribute("cx", sx); sun.setAttribute("cy", sy); glow.setAttribute("cx", sx); glow.setAttribute("cy", sy);
      const low = 1 - Math.sin(Math.PI*t);            // 1 at the horizon, 0 at noon
      sky1.setAttribute("stop-color", mix("cfe0e6","f2c7a0", low*.8)); sky2.setAttribute("stop-color", mix("eef1ea","f6e3cc", low*.7));
      const dx = (t - .5) * -210, len = 1 + low*.35;  // shadow falls away from the sun, longer when the sun is low
      let p = "";
      for (let k=0;k<N;k++){
        const f = 40+k*(320/(N-1)), b = 90+k*(220/(N-1));
        const fx = f + dx*len, bx = b + dx*.78*len;
        p += `<path class="shadow" d="M${fx.toFixed(1)} 282L${bx.toFixed(1)} 238"/>`;
      }
      shadows.innerHTML = p;
      out.textContent = fmt(h); cap.textContent = `שעה ${fmt(h)}`;
    };
    let auto = !reduce, t0 = performance.now();
    const loop = t => { if (!auto) return; const h = 12.5 + Math.sin((t - t0)/5200 - Math.PI/2*1.15) * 5.6; range.value = h; draw(+range.value); requestAnimationFrame(loop); };
    draw(+range.value);
    if (auto) requestAnimationFrame(loop);
    range.addEventListener("input", ()=>{ auto = false; draw(+range.value); });
    document.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click", ()=>{
      document.querySelectorAll(".chips button").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
      scene.style.setProperty("--slat-c", MATS[+b.dataset.i][1]);
    }));
  }

  // film
  const F = document.getElementById("film");
  if (F){
    const slides=[...F.querySelectorAll(".slide")], cap=document.getElementById("film-cap"), cnt=document.getElementById("film-count"), n=slides.length;
    let i=0, timer=null;
    const go = k => { i=(k+n)%n;
      slides.forEach((s,j)=>{ s.classList.toggle("on", j===i); s.setAttribute("aria-hidden", j===i?"false":"true"); });
      const img = slides[i].querySelector("img"); img.style.animation="none"; void img.offsetWidth; img.style.animation="";
      cap.textContent = photos[i].cap || ""; cnt.textContent = `${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`; };
    const play = () => { clearInterval(timer); if (!reduce) timer = setInterval(()=>go(i+1), 6500); };
    document.getElementById("film-next").addEventListener("click", ()=>{ go(i+1); play(); });
    document.getElementById("film-prev").addEventListener("click", ()=>{ go(i-1); play(); });
    F.addEventListener("pointerenter", e=>{ if(e.pointerType==="mouse") clearInterval(timer); });
    F.addEventListener("pointerleave", play);
    let sx=null;
    F.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; }, {passive:true});
    F.addEventListener("touchend", e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){ go(i + (dx>0?1:-1)); play(); } sx=null; });
    play();
  }
})();
</script>
